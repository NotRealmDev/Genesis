<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis</title>
<meta name="theme-color" content="#080d16">
<link rel="icon" type="image/png" href="assets/icons/genesis-192.png">
<link rel="apple-touch-icon" href="assets/icons/genesis-192.png">
<script src="genesis-intro-state.js"></script>
<style>
:root{color-scheme:dark;--ink:#f7f9ff;--muted:rgba(235,241,255,.62);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050711;color:var(--ink);font-family:Inter,Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}
.stage{position:relative;isolation:isolate;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,#1c2344 0,#080a16 43%,#03040a 100%)}
.stage:before,.stage:after{content:"";position:absolute;border-radius:999px;filter:blur(80px);pointer-events:none;z-index:-1}.stage:before{width:48vw;height:48vw;min-width:280px;min-height:280px;left:-14vw;top:-18vw;background:rgba(100,91,255,.23);animation:drift 8s ease-in-out infinite alternate}.stage:after{width:42vw;height:42vw;min-width:260px;min-height:260px;right:-13vw;bottom:-18vw;background:rgba(233,78,181,.20);animation:drift 9s ease-in-out -3s infinite alternate}
.grid{position:absolute;inset:0;opacity:.20;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
.intro-card{width:min(680px,calc(100vw - 34px));padding:34px 34px 27px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.115),rgba(255,255,255,.035));box-shadow:inset 0 1px rgba(255,255,255,.14),0 30px 100px rgba(0,0,0,.44);backdrop-filter:blur(30px) saturate(145%);-webkit-backdrop-filter:blur(30px) saturate(145%);text-align:center;animation:cardIn .8s cubic-bezier(.2,.8,.2,1) both}
.brand{display:flex;justify-content:center;align-items:center;gap:17px}.brand img{width:82px;height:82px;border-radius:20px;box-shadow:0 16px 35px rgba(101,76,255,.26),0 4px 14px rgba(0,0,0,.28);animation:logoIn .95s cubic-bezier(.2,.85,.2,1) .12s both}.brand-copy{text-align:left}.eyebrow{font-size:10px;letter-spacing:.28em;color:#b9c3ff;font-weight:750}.brand h1{margin:7px 0 0;font-size:42px;line-height:.9;letter-spacing:-.08em;font-weight:800}.brand p{margin:10px 0 0;color:var(--muted);font-size:12px}
.feature-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:30px 0 24px}.feature{padding:12px 8px;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:rgba(255,255,255,.055);animation:featureIn .55s cubic-bezier(.2,.8,.2,1) both}.feature:nth-child(2){animation-delay:.08s}.feature:nth-child(3){animation-delay:.16s}.feature:nth-child(4){animation-delay:.24s}.feature-icon{display:block;margin-bottom:7px;font-size:18px}.feature span:last-child{display:block;color:#d8def2;font-size:10px;font-weight:650}
.loading{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--muted);font-size:11px}.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}.progress{height:3px;margin:14px 0 16px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.10)}.progress span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#9da6ff,#f18fcf);animation:progress 4.8s linear forwards}.skip{border:0;background:transparent;color:rgba(255,255,255,.50);font-size:10px;cursor:pointer;padding:4px 8px}.skip:hover{color:#fff}
@keyframes drift{to{transform:translate3d(30px,-24px,0) scale(1.12)}}@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(9px)}to{opacity:1;transform:none;filter:none}}@keyframes logoIn{from{opacity:0;transform:scale(.72) rotate(-8deg);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}@keyframes featureIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes progress{to{width:100%}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.intro-card{padding:26px 18px 22px;border-radius:24px}.brand img{width:68px;height:68px;border-radius:17px}.brand h1{font-size:34px}.brand p{font-size:10px}.feature-row{gap:6px;margin:24px 0 20px}.feature{padding:10px 4px}.feature-icon{font-size:16px}.feature span:last-child{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="stage" aria-label="Genesis loading">
  <div class="grid" aria-hidden="true"></div>
  <section class="intro-card">
    <div class="brand"><img src="assets/icons/genesis-192.png" alt="Genesis OS"><div class="brand-copy"><div class="eyebrow">WELCOME TO</div><h1>GENESIS</h1><p>Your glass desktop is getting ready.</p></div></div>
    <div class="feature-row" aria-label="Genesis features"><div class="feature"><span class="feature-icon">⌘</span><span>Glass Desktop</span></div><div class="feature"><span class="feature-icon">✦</span><span>GPT</span></div><div class="feature"><span class="feature-icon">◈</span><span>Games</span></div><div class="feature"><span class="feature-icon">◌</span><span>Messages</span></div></div>
    <div class="loading"><span class="spinner" aria-hidden="true"></span><span id="loadingText">Opening your workspace…</span></div>
    <div class="progress" aria-hidden="true"><span></span></div>
    <button class="skip" id="skipIntro" type="button">Skip intro</button>
  </section>
</main>
<script>
(function(){
  "use strict";
  const loginKey="genesisLogin";
  let login=null;
  try{login=JSON.parse(localStorage.getItem(loginKey)||"null");}catch(_){ }
  if(!login || !login.expires || Date.now()>=login.expires){location.replace("index.html");return;}
  sessionStorage.setItem("realmAuth","1");
  sessionStorage.setItem("realmUser",login.user||"");
  sessionStorage.setItem("genesisRole",login.role||"user");
  const state=window.GenesisIntroState;
  if(state && !state.shouldShow(login)){location.replace("os.html");return;}
  let finished=false;
  function openDesktop(){
    if(finished)return;
    finished=true;
    try{state?.complete(login);}catch(_){ }
    location.replace("os.html");
  }
  document.getElementById("skipIntro")?.addEventListener("click",openDesktop);
  document.addEventListener("keydown",event=>{if(event.key==="Escape"||event.key==="Enter")openDesktop();});
  window.setTimeout(openDesktop,4800);
})();
</script>
</body>
</html>
