name: Genesis proxy tests

on:
  pull_request:
    paths:
      - "genesis-prism.js"
      - "browser-tab.html"
      - "os.html"
      - "servy.js"
      - "prism*.js"
      - "prism.wasm"
      - "libby.js"
      - "tests/**"
      - ".github/workflows/proxy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run proxy unit and integration-contract tests
        run: node --test tests/proxy-resilience.test.mjs

  live-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and pinned official Scramjet runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 @mercuryworkshop/scramjet@2.0.67-alpha.2 @mercuryworkshop/scramjet-controller@0.0.14
          test -f node_modules/@mercuryworkshop/scramjet/dist/scramjet.js
          test -f node_modules/@mercuryworkshop/scramjet/dist/scramjet.wasm
          test -f node_modules/@mercuryworkshop/scramjet-controller/dist/controller.api.js
          test -f node_modules/@mercuryworkshop/scramjet-controller/dist/controller.inject.js
          cp node_modules/@mercuryworkshop/scramjet/dist/scramjet.js prism.js
          cp node_modules/@mercuryworkshop/scramjet/dist/scramjet.wasm prism.wasm
          cp node_modules/@mercuryworkshop/scramjet-controller/dist/controller.api.js prism.api.js
          cp node_modules/@mercuryworkshop/scramjet-controller/dist/controller.inject.js prism.inject.js
          sha256sum prism.js prism.wasm prism.api.js prism.inject.js
          npx playwright install --with-deps chromium
      - name: Test Wisp route, Scramjet rewrite, and YouTube dynamic results
        run: node tests/proxy-e2e.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-proxy-failure
          path: test-output/
          if-no-files-found: ignore
