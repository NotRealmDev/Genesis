<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ragdoll Archers</title>

  <script src="https://cdn.jsdelivr.net/gh/laparda14/Ragdoll-archers@62504c9570ea720c6367e7debe1e110c68f77c2d/vs/gameloader-helper.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/styyyle.css">

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#111;
    }
    #unity-container{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#111;
    }
    #unity-canvas{
      width:100%;
      height:100%;
      display:block;
      background:#111;
      outline:none;
    }
    #loading-cover{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#181818;
      z-index:20;
      font-family:Arial,Helvetica,sans-serif;
      color:white;
    }
    #unity-loading-bar{
      width:min(420px,80vw);
      text-align:center;
    }
    #unity-logo img{
      width:112px;
      height:112px;
      object-fit:cover;
      border-radius:24px;
      box-shadow:0 14px 45px rgba(0,0,0,.35);
      margin-bottom:22px;
    }
    #unity-progress-bar-empty{
      width:100%;
      height:10px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.12);
    }
    #unity-progress-bar-full{
      width:0%;
      height:100%;
      border-radius:999px;
      background:white;
      transition:width .15s linear;
    }
    #loading-text{
      margin-top:12px;
      font-size:13px;
      opacity:.65;
    }
  </style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="0"></canvas>
  </div>

  <div id="loading-cover">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="ragdoll-archers.png" alt="Ragdoll Archers"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="loading-text">Loading Ragdoll Archers...</div>
    </div>
  </div>

  <script>
    const loaderUrl =
      "https://cdn.jsdelivr.net/gh/bubbls/ruffle@7117cc5006472d782b65d96abd375597d6273242/v11121212.js";

    const config = {
      dataUrl:
        "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
      frameworkUrl:
        "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
      codeUrl:
        "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ericetto",
      productName: "Ragdoll Archers",
      productVersion: "0.1"
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const loadingText = document.querySelector("#loading-text");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    function sizeCanvas(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.width = Math.max(1, Math.floor(innerWidth * dpr));
      canvas.height = Math.max(1, Math.floor(innerHeight * dpr));
    }
    sizeCanvas();
    addEventListener("resize", sizeCanvas);

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;

    unityLoader.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = `${100 * progress}%`;
        loadingText.textContent = `Loading Ragdoll Archers... ${Math.round(progress * 100)}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
        canvas.focus();
      }).catch((message) => {
        loadingText.textContent = String(message);
      });
    };

    unityLoader.onerror = () => {
      loadingText.textContent = "Could not load the Ragdoll Archers game loader.";
    };

    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      window.focus();
      canvas.focus();
    });
  </script>
</body>
</html>
