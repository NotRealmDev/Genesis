<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    min-height: 100vh;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
    display: grid;
    place-items: center;
    isolation: isolate;
  }

  .logo-wrap {
    position: absolute;
    width: min(72vmin, 760px);
    aspect-ratio: 1280 / 1229;
    transform: scale(1.24);
    animation: cameraMove 12s cubic-bezier(.16,.73,.22,1) forwards;
    will-change: transform;
  }

  .icon,
  .os-only {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
    backface-visibility: hidden;
    transform: translateZ(0);
  }

  /* Exact icon that was already made */
  .icon {
    opacity: 0;
    filter: brightness(.30) blur(4px);
    animation: iconLife 12s cubic-bezier(.22,.7,.2,1) forwards;
  }

  /* Exact OS lettering extracted from that same icon */
  .os-only {
    opacity: 0;
    filter: blur(2px);
    animation: osLife 12s cubic-bezier(.22,.72,.18,1) forwards;
  }

  .black-fade {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #000;
    pointer-events: none;
    animation: blackCurtain 12s ease-in-out forwards;
  }

  .vignette {
    position: absolute;
    inset: -10%;
    z-index: 7;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 48%,
        rgba(0,0,0,0) 20%,
        rgba(0,0,0,.06) 47%,
        rgba(0,0,0,.42) 78%,
        rgba(0,0,0,.92) 115%);
    opacity: .62;
    animation: vignettePulse 12s ease-in-out forwards;
  }

  .glow {
    position: absolute;
    width: min(68vmin, 720px);
    aspect-ratio: 1;
    border-radius: 50%;
    z-index: -1;
    background: radial-gradient(circle,
      rgba(201,67,255,.12) 0%,
      rgba(255,65,147,.07) 33%,
      rgba(0,0,0,0) 72%);
    filter: blur(35px);
    opacity: 0;
    animation: glowLife 12s ease-in-out forwards;
  }

  .grain {
    position: absolute;
    inset: -75%;
    width: 250%;
    height: 250%;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    background-image:
      repeating-radial-gradient(circle at 15% 20%,
        rgba(255,255,255,.035) 0 1px,
        transparent 1px 4px);
    animation:
      grainLife 12s linear forwards,
      grainMove .18s steps(2,end) infinite;
  }

  @keyframes cameraMove {
    0%   { transform: scale(1.24) translateY(1.2%); }
    15%  { transform: scale(1.19) translateY(.8%); }
    54%  { transform: scale(1.00) translateY(0); }
    74%  { transform: scale(.93) translateY(-.2%); }
    100% { transform: scale(.90) translateY(-.4%); }
  }

  @keyframes iconLife {
    0%   {
      opacity: 0;
      filter: brightness(.22) blur(5px);
    }
    9%   {
      opacity: .18;
      filter: brightness(.42) blur(3px);
    }
    19%  {
      opacity: 1;
      filter: brightness(.90) blur(.8px);
    }
    31%  {
      opacity: 1;
      filter: brightness(1) blur(0);
    }
    57%  {
      opacity: 1;
      filter: brightness(1) blur(0);
    }
    68%  {
      opacity: .42;
      filter: brightness(.82) blur(1.7px);
    }
    75%  {
      opacity: 0;
      filter: brightness(.45) blur(5px);
    }
    100% {
      opacity: 0;
      filter: brightness(.25) blur(7px);
    }
  }

  @keyframes osLife {
    0%, 54% {
      opacity: 0;
      filter: blur(2px);
    }
    61% {
      opacity: .12;
      filter: blur(1.2px);
    }
    70% {
      opacity: 1;
      filter: blur(0);
    }
    84% {
      opacity: 1;
      filter: blur(0);
    }
    91% {
      opacity: .74;
      filter: blur(.5px);
    }
    100% {
      opacity: 0;
      filter: blur(4px);
    }
  }

  @keyframes blackCurtain {
    0%   { opacity: 1; }
    7%   { opacity: .94; }
    18%  { opacity: .22; }
    28%  { opacity: 0; }
    86%  { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes glowLife {
    0%, 10% { opacity: 0; transform: scale(.85); }
    28% { opacity: .8; transform: scale(1); }
    62% { opacity: .52; transform: scale(1.06); }
    79% { opacity: .18; transform: scale(1.12); }
    100% { opacity: 0; transform: scale(1.18); }
  }

  @keyframes vignettePulse {
    0%   { opacity: 1; }
    25%  { opacity: .53; }
    64%  { opacity: .68; }
    84%  { opacity: .80; }
    100% { opacity: 1; }
  }

  @keyframes grainLife {
    0%, 12% { opacity: 0; }
    25% { opacity: .10; }
    70% { opacity: .07; }
    100% { opacity: 0; }
  }

  @keyframes grainMove {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-1.2%, .8%); }
    50%  { transform: translate(.9%, -1.1%); }
    75%  { transform: translate(1.3%, .7%); }
    100% { transform: translate(-.8%, 1.2%); }
  }

  @media (max-width: 700px) {
    .logo-wrap {
      width: min(84vmin, 680px);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-wrap, .icon, .os-only, .black-fade,
    .vignette, .glow, .grain {
      animation-duration: .01ms !important;
      animation-delay: 0ms !important;
    }
  }
</style>
<script>
(function(){
  try{
    const login = JSON.parse(localStorage.getItem("genesisLogin") || "null");
    if(login && login.expires && Date.now() < login.expires){
      sessionStorage.setItem("realmAuth","1");
      sessionStorage.setItem("realmUser",login.user || "");
      sessionStorage.setItem("genesisRole",login.role || "user");
      return;
    }
  }catch(e){}
  if(sessionStorage.getItem("realmAuth") !== "1") location.replace("index.html");
})();
</script>
