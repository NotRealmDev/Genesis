<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Genesis proxy test harness</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{background:#080b12}</style>
</head>
<body>
<iframe id="target" allow="autoplay; encrypted-media; fullscreen"></iframe>
<script src="../prism.js"></script>
<script src="../prism.api.js"></script>
<script src="../libby.js"></script>
<script src="../genesis-prism.js"></script>
<script>
(function(){
  const element=document.getElementById("target");
  let prismFrame=null;

  function waitForLoad(action,timeoutMs=60000){
    return new Promise((resolve,reject)=>{
      let timer=null;
      const cleanup=()=>{clearTimeout(timer);element.removeEventListener("load",onload)};
      const onload=()=>{cleanup();resolve(true)};
      timer=setTimeout(()=>{cleanup();reject(new Error("Proxy frame load timed out"))},timeoutMs);
      element.addEventListener("load",onload);
      try{action()}catch(err){cleanup();reject(err)}
    });
  }

  window.proxyHarness={
    async start(){
      prismFrame=await window.GenesisPrism.createFrame(element);
      return window.GenesisPrism.healthCheck();
    },
    async go(url){
      if(!prismFrame) await this.start();
      return waitForLoad(()=>prismFrame.go(url));
    },
    async repairAndGo(url){
      prismFrame=await window.GenesisPrism.recoverFrame(element,"automated integration retry",{rotateWisp:true});
      return waitForLoad(()=>prismFrame.go(url));
    },
    report(){
      let text="";
      try{text=(element.contentDocument?.body?.innerText||"").slice(0,1200)}catch{}
      return{diagnostics:window.GenesisPrism.diagnostics(),text};
    }
  };
  window.proxyHarnessLoaded=true;
})();
</script>
</body>
</html>
