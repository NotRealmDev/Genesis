name: Genesis proxy tests

on:
  pull_request:
    paths:
      - "genesis-prism.js"
      - "genesis-browser-extras.js"
      - "genesis-ui-polish.js"
      - "genesis-gpt.*"
      - "genesis-install.*"
      - "genesis-intro*"
      - "intro.html"
      - "manifest.webmanifest"
      - "offline.html"
      - "assets/icons/**"
      - "assets/audio/**"
      - "browser-tab.html"
      - "index.html"
      - "os.html"
      - "eaglercraft.html"
      - "games-c-s.js"
      - "games-s-z.js"
      - "genesis-announcements.js"
      - "genesis-messages.js"
      - "supabase-config.js"
      - "servy.js"
      - "prism*.js"
      - "prism.wasm"
      - "libby.js"
      - "tests/**"
      - ".github/workflows/proxy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run proxy unit and integration-contract tests
        run: node --test tests/proxy-resilience.test.mjs tests/os-features.test.mjs tests/announcements-global.test.mjs tests/browser-extras.test.mjs tests/ui-polish.test.mjs tests/showcase-state.test.mjs tests/games-s-z.test.mjs tests/gpt-native.test.mjs

  gpt-install-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify native GPT, installation, and first-run intro
        run: node tests/gpt-install-showcase.e2e.mjs

  game-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify every game path and live embed assets
        run: node tests/game-assets-live.mjs

  live-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test announcements and live Messages delivery
        run: node tests/live-services.mjs

  os-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Messages UI and Survival Race runtime
        run: xvfb-run -a env GENESIS_TEST_HEADFUL=1 node tests/os-e2e.mjs

  live-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Scramjet sites and real YouTube playback
        run: xvfb-run -a env GENESIS_TEST_HEADFUL=1 node tests/proxy-e2e.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-proxy-failure
          path: test-output/
          if-no-files-found: ignore
