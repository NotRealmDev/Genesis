<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis</title>
<style>
:root{
  --accent:215;
  --blur:28px;
  --glass:rgba(16,21,34,.62);
  --glass2:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.12);
  --text:#f6f8ff;
  --muted:rgba(255,255,255,.58);
  --shadow:0 28px 90px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050b;color:var(--text);font-family:Inter,Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{color:inherit}
#os{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:
   radial-gradient(circle at 16% 18%,hsla(var(--accent),80%,52%,.32),transparent 31%),
   radial-gradient(circle at 78% 74%,hsla(calc(var(--accent) + 62),82%,50%,.20),transparent 36%),
   linear-gradient(145deg,#050812,#09111f 45%,#02040a);
}
#os:before,#os:after{content:"";position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;animation:floatGlow 14s ease-in-out infinite alternate}
#os:before{width:430px;height:430px;left:-140px;top:5%;background:hsla(var(--accent),85%,55%,.20)}
#os:after{width:480px;height:480px;right:3%;bottom:-220px;background:hsla(calc(var(--accent) + 58),85%,55%,.15);animation-delay:-7s}
@keyframes floatGlow{to{transform:translate3d(55px,-35px,0) scale(1.12)}}
.wallpaper-grid{position:absolute;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:50px 50px;mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 75%,transparent)}
.watermark{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-size:clamp(82px,14vw,190px);font-weight:900;letter-spacing:-12px;color:rgba(255,255,255,.026);pointer-events:none}
.desktop{position:absolute;inset:0 230px 96px 0}
.desktop-icon{position:absolute;width:90px;height:104px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:default;touch-action:none}
.desktop-icon.dragging{z-index:9999;opacity:.85;filter:brightness(1.17)}
.desktop-icon.selected .app-icon{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.26)}
.app-icon{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.145),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.115);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px rgba(255,255,255,.1),0 12px 30px rgba(0,0,0,.23);transition:.22s cubic-bezier(.2,.8,.2,1)}
.desktop-icon:hover .app-icon{transform:translateY(-4px) scale(1.05);background:rgba(255,255,255,.14)}
.app-icon svg{width:31px;height:31px;stroke:#fff;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.app-name{font-size:12px;font-weight:500;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.9)}

.sidebar{
 position:absolute;top:16px;right:16px;bottom:16px;width:205px;padding:22px;border-radius:28px;
 background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
 border:1px solid var(--border);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
 box-shadow:inset 0 1px rgba(255,255,255,.1),0 25px 70px rgba(0,0,0,.30);z-index:40;overflow:hidden
}
.sidebar>*:not(.welcome-fireworks){position:relative;z-index:2}
.welcome-fireworks{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:1;transition:opacity .9s ease}
.welcome-fireworks.done{opacity:0}
.clock-line{display:flex;align-items:flex-end;gap:6px}.clock{font-size:44px;font-weight:300;letter-spacing:-3px}.seconds{font-size:15px;color:var(--muted);padding-bottom:7px}
.date{font-size:13px;line-height:1.5;color:var(--muted);margin-top:3px}.divider{height:1px;background:rgba(255,255,255,.09);margin:20px 0}.side-title{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:rgba(255,255,255,.40);margin-bottom:10px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{height:58px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.055);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:.18s}.quick:hover{transform:translateY(-2px);background:rgba(255,255,255,.11)}.quick.active{background:hsla(var(--accent),80%,55%,.44)}.quick.blank-quick{grid-column:1/-1;height:48px;flex-direction:row}.quick small{font-size:9px;color:rgba(255,255,255,.7)}
.system-card{padding:12px 13px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}.system-row{display:flex;justify-content:space-between;font-size:11px;margin:8px 0}.system-row span:first-child{color:var(--muted)}

.dock-wrap{position:absolute;left:calc(50% - 105px);bottom:18px;transform:translateX(-50%);z-index:100}
.dock{height:68px;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:25px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.045));backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:inset 0 1px rgba(255,255,255,.12),0 15px 45px rgba(0,0,0,.32)}
.dock-app{position:relative;width:49px;height:49px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));display:grid;place-items:center;cursor:pointer;transition:.24s cubic-bezier(.2,.9,.2,1.2)}
.dock-app:hover{transform:translateY(-8px) scale(1.12);background:rgba(255,255,255,.18)}.dock-app svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:1.7}.dock-dot{position:absolute;bottom:-6px;left:50%;width:4px;height:4px;border-radius:50%;background:#fff;transform:translateX(-50%);opacity:0}.dock-app.running .dock-dot{opacity:.8}

.window{
 position:absolute;width:min(780px,calc(100vw - 280px));height:min(520px,calc(100vh - 145px));min-width:360px;min-height:270px;
 left:50%;top:50%;transform:translate(-50%,-50%);border-radius:25px;overflow:hidden;resize:both;border:1px solid rgba(255,255,255,.13);
 background:linear-gradient(145deg,rgba(20,26,40,.88),rgba(8,12,22,.78));backdrop-filter:blur(35px) saturate(150%);-webkit-backdrop-filter:blur(35px) saturate(150%);
 box-shadow:inset 0 1px rgba(255,255,255,.1),var(--shadow);z-index:300;animation:windowOpen .3s cubic-bezier(.2,.85,.2,1.08)
}
@keyframes windowOpen{from{opacity:0;transform:translate(-50%,-45%) scale(.9);filter:blur(8px)}to{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}}
.window.closing{opacity:0;transform:scale(.9);transition:.18s}.window.minimized{opacity:0;pointer-events:none;transform:scale(.5) translateY(500px);transition:.25s}.window.maximized{left:12px!important;top:12px!important;width:calc(100vw - 245px)!important;height:calc(100vh - 24px)!important;transform:none!important;resize:none;border-radius:22px}
.window-header{height:51px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.07);cursor:grab;background:rgba(255,255,255,.025);touch-action:none}
.window-controls{display:flex;gap:7px}.window-control{width:12px;height:12px;border:0;border-radius:50%;cursor:pointer}.close{background:#ff5f57}.minimize{background:#febc2e}.maximize{background:#28c840}
.window-title{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:550;color:rgba(255,255,255,.80);pointer-events:none}.window-content{height:calc(100% - 51px);overflow:auto;user-select:text}
.section{padding:25px}.heading{font-size:24px;font-weight:650;margin:0 0 20px}.muted{color:var(--muted)}

.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:15px}.file-card{height:115px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);transition:.18s}.file-card:hover{background:rgba(255,255,255,.10);transform:translateY(-3px)}.folder{width:46px;height:35px;border-radius:7px;background:linear-gradient(145deg,hsl(var(--accent),80%,65%),hsl(var(--accent),70%,45%));position:relative}.folder:before{content:"";position:absolute;width:22px;height:8px;top:-5px;left:3px;border-radius:5px 5px 0 0;background:hsl(var(--accent),75%,62%)}

.notes{height:100%;padding:22px}.notes textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#fff;font-size:15px;line-height:1.65}
.settings label{display:block;font-size:12px;color:var(--muted);margin-bottom:9px}.setting{margin-bottom:22px}.setting input[type=range]{width:100%}.os-btn{border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.07);cursor:pointer;transition:.18s}.os-btn:hover{background:rgba(255,255,255,.13)}
.about{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.about-logo{font-size:82px;font-weight:900;letter-spacing:-8px}.realm-credit{margin-top:18px;padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);font-size:14px}

.games{padding:22px}.games-top{display:flex;gap:12px;align-items:center;margin-bottom:19px}.games-title-wrap{min-width:120px}.games-title{font-size:24px;font-weight:650}.games-count{font-size:11px;color:var(--muted);margin-top:2px}
.game-search-wrap{flex:1;position:relative}.game-search{width:100%;height:43px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(255,255,255,.055);color:#fff;outline:0;padding:0 15px 0 41px;transition:.18s}.game-search:focus{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.18);box-shadow:0 0 0 4px rgba(255,255,255,.035)}.search-glyph{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}.game-card{overflow:hidden;border-radius:22px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);box-shadow:0 15px 34px rgba(0,0,0,.20);transition:.23s cubic-bezier(.2,.8,.2,1)}.game-card:hover{transform:translateY(-5px) scale(1.012);background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.18)}
.game-thumb{width:100%;height:145px;object-fit:cover;display:block;background:#111}.game-info{height:62px;padding:0 14px;display:flex;align-items:center;justify-content:space-between}.game-name{font-size:14px;font-weight:650}.game-dev{font-size:10px;color:var(--muted);margin-top:2px}.play-pill{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.10);font-size:12px}.no-games{display:none;padding:35px;text-align:center;color:var(--muted)}
.games-more{display:none;margin:22px auto 4px;min-width:180px}

.player{height:100%;display:flex;flex-direction:column;background:#020305}.player-toolbar{height:50px;display:flex;align-items:center;gap:9px;padding:7px 10px;flex:none;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035)}.player-toolbar .os-btn{padding:7px 11px}.player-name{flex:1;text-align:center;font-size:12px;font-weight:600;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-stage{position:relative;flex:1;min-height:0;background:#000}.player-frame{display:block;width:100%;height:100%;border:0;background:#000}.loader{position:absolute;inset:0;display:grid;place-items:center;background:#05070b;z-index:2;pointer-events:none;transition:.35s}.loader.hidden{opacity:0}.loader-inner{text-align:center;color:var(--muted);font-size:12px}.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#fff;animation:spin .7s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}

.browser{height:100%;display:flex;flex-direction:column;background:#060912}.browser-toolbar{min-height:56px;height:auto;display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);flex:none}.nav-btn{width:38px;height:38px;padding:0;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.055);cursor:pointer;font-size:16px;flex:none}.nav-btn:hover{background:rgba(255,255,255,.11)}.nav-btn:disabled{opacity:.28;cursor:default}.address-wrap{position:relative;flex:1;min-width:160px}.browser-address{width:100%;height:38px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.055);color:#fff;outline:0;padding:0 40px 0 13px;user-select:text}.browser-address:focus{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.18)}.browser-go{position:absolute;right:5px;top:5px;width:28px;height:28px;border:0;border-radius:8px;background:hsla(var(--accent),75%,55%,.55);cursor:pointer}.browser-status{height:25px;padding:5px 12px;font-size:10px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.05);background:rgba(0,0,0,.12);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.browser-stage{position:relative;flex:1;min-height:0;background:#070a11}.browser-frame{display:block;width:100%;height:100%;border:0;background:#070a11}.browser-home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,hsla(var(--accent),70%,45%,.16),transparent 33%),#070a11;color:#fff;text-align:center;padding:30px}.browser-home .logo{font-size:72px;font-weight:900;letter-spacing:-7px}.browser-home p{max-width:500px;color:var(--muted);font-size:13px;line-height:1.55}.browser-home.hidden{display:none}

.browser-official-frame{display:none}

.music{
  min-height:100%;
  display:grid;
  place-items:center;
  padding:26px;
  background:
    radial-gradient(circle at 50% 20%,hsla(var(--accent),80%,55%,.16),transparent 40%),
    linear-gradient(180deg,rgba(255,255,255,.018),transparent);
}
.music-player{
  width:min(560px,100%);
  padding:26px;
  border-radius:28px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 26px 70px rgba(0,0,0,.28);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.music-top{
  display:grid;
  grid-template-columns:128px minmax(0,1fr);
  gap:22px;
  align-items:center;
}
.music-art{
  width:128px;
  height:128px;
  border-radius:30px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),transparent 26%),
    linear-gradient(145deg,hsla(var(--accent),80%,58%,.48),rgba(255,255,255,.055));
  border:1px solid rgba(255,255,255,.13);
  font-size:54px;
  box-shadow:0 22px 55px rgba(0,0,0,.25);
}
.music-title{
  font-size:20px;
  line-height:1.25;
  font-weight:720;
  overflow:hidden;
  text-overflow:ellipsis;
}
.music-subtitle{
  margin-top:7px;
  font-size:11px;
  color:var(--muted);
}
.music-time-row{
  display:flex;
  justify-content:space-between;
  margin-top:22px;
  margin-bottom:8px;
  color:var(--muted);
  font-size:10px;
  font-variant-numeric:tabular-nums;
}
.music-seek,
.music-volume{
  width:100%;
  accent-color:hsl(var(--accent),78%,62%);
  cursor:pointer;
}
.music-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:18px;
}
.music-control{
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.07);
  color:#fff;
  cursor:pointer;
  transition:.18s;
  border-radius:50%;
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  font-size:15px;
}
.music-control:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.13);
}
.music-play{
  width:58px;
  height:58px;
  background:#fff;
  color:#0b0d12;
  font-size:19px;
  border:0;
}
.music-play:hover{background:#fff;transform:scale(1.05)}
.music-volume-row{
  display:grid;
  grid-template-columns:22px 1fr 36px;
  gap:10px;
  align-items:center;
  margin-top:20px;
  padding-top:17px;
  border-top:1px solid rgba(255,255,255,.07);
  color:var(--muted);
  font-size:11px;
}
.music-now{
  margin-top:14px;
  text-align:center;
  min-height:18px;
  font-size:10px;
  color:var(--muted);
}
@media(max-width:560px){
  .music-top{grid-template-columns:1fr;text-align:center}
  .music-art{margin:auto}
}

@media(max-width:800px){
 .sidebar{display:none}.desktop{right:0}.dock-wrap{left:50%}
 .window,.window.maximized{left:12px!important;top:12px!important;width:calc(100vw - 24px)!important;height:calc(100vh - 105px)!important;transform:none!important;resize:none}
 .games-top{align-items:stretch;flex-direction:column}.games-title-wrap{min-width:0}
}

/* Game Request app */
.game-request-shell{
  position:relative;
  height:100%;
  min-height:360px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% 25%,hsla(var(--accent),85%,62%,.13),transparent 38%),
    linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.12));
}
.game-request-shell::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%,transparent 25%,rgba(0,0,0,.22) 100%);
}
.gr-scene{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:36px;
  opacity:0;
  transform:scale(1.035);
  filter:blur(9px);
  pointer-events:none;
  transition:
    opacity .72s cubic-bezier(.22,.8,.2,1),
    transform .82s cubic-bezier(.22,.8,.2,1),
    filter .72s ease;
}
.gr-scene.active{
  opacity:1;
  transform:scale(1);
  filter:blur(0);
  pointer-events:auto;
}
.gr-scene.leaving{
  opacity:0;
  transform:scale(.965);
  filter:blur(10px);
  pointer-events:none;
}
.gr-inner{
  width:min(610px,92%);
  text-align:center;
}
.gr-kicker{
  margin-bottom:14px;
  font-size:10px;
  letter-spacing:.32em;
  text-transform:uppercase;
  opacity:.42;
}
.gr-question{
  margin:0 0 30px;
  font-size:clamp(27px,4vw,50px);
  line-height:1.03;
  font-weight:650;
  letter-spacing:-.045em;
}
.gr-input-wrap{
  width:min(480px,100%);
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 8px 8px 18px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.065);
  box-shadow:0 18px 55px rgba(0,0,0,.20);
  backdrop-filter:blur(20px);
}
.gr-input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  color:#fff;
  background:transparent;
  font:500 16px/1.3 Inter,Poppins,system-ui,sans-serif;
}
.gr-input::placeholder{color:rgba(255,255,255,.30)}
.gr-next{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.13);
  color:#fff;
  background:rgba(255,255,255,.10);
  cursor:pointer;
  font-size:20px;
  transition:.2s ease;
}
.gr-next:hover{transform:translateX(2px);background:rgba(255,255,255,.17)}
.gr-done{
  opacity:0;
  transform:translateY(12px) scale(.96);
  min-width:150px;
  padding:14px 26px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.17);
  color:#fff;
  background:rgba(255,255,255,.11);
  box-shadow:0 20px 55px rgba(0,0,0,.22);
  backdrop-filter:blur(22px);
  font:650 15px/1 Inter,Poppins,system-ui,sans-serif;
  cursor:pointer;
  animation:grDoneIn .7s .18s cubic-bezier(.18,.8,.22,1) forwards;
}
.gr-done:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.gr-summary{
  margin:18px auto 0;
  width:min(470px,100%);
  font-size:12px;
  line-height:1.65;
  opacity:.45;
}
.gr-status-icon{
  width:70px;
  height:70px;
  margin:0 auto 22px;
  display:grid;
  place-items:center;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  font-size:29px;
}
.gr-status-title{
  font-size:34px;
  font-weight:650;
  letter-spacing:-.04em;
}
.gr-status-copy{
  max-width:460px;
  margin:12px auto 0;
  opacity:.52;
  line-height:1.55;
  font-size:13px;
}
.gr-reset{
  margin-top:22px;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.58);
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:4px;
}
@keyframes grDoneIn{
  to{opacity:1;transform:translateY(0) scale(1)}
}


.browser-mode{
  height:38px;
  padding:0 12px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  background:rgba(255,255,255,.055);
  color:#fff;
  font:600 11px/1 Inter,Poppins,system-ui,sans-serif;
  cursor:pointer;
  white-space:nowrap;
}
.browser-mode:hover{background:rgba(255,255,255,.11)}
.browser-mode.embed{background:hsla(var(--accent),70%,55%,.16)}
.browser-profile{
  height:38px;
  min-width:92px;
  padding:0 28px 0 11px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  background:rgba(255,255,255,.055);
  color:#fff;
  font:600 11px/1 Inter,Poppins,system-ui,sans-serif;
  outline:0;
  cursor:pointer;
}
.browser-profile option{background:#0d111a;color:#fff}
.browser-profile-fixed{
  padding:0 13px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:72px;
  cursor:default;
  user-select:none;
}
.browser-open-card{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:
    radial-gradient(circle at 50% 35%,hsla(var(--accent),70%,45%,.14),transparent 34%),
    #070a11;
  color:#fff;
  text-align:center;
}
.browser-open-card.show{display:flex}
.browser-open-card .inner{max-width:510px}
.browser-open-card .globe{
  width:72px;height:72px;margin:0 auto 18px;border-radius:24px;
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.065);
  font-size:30px;
}
.browser-open-card h3{margin:0 0 8px;font-size:24px}
.browser-open-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.browser-open-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:18px}
.browser-open-card button,.browser-open-card a{
  padding:11px 16px;border-radius:13px;
  border:1px solid rgba(255,255,255,.11);text-decoration:none;
  background:rgba(255,255,255,.08);color:#fff;cursor:pointer
}
.browser-open-card a{background:hsla(var(--accent),72%,55%,.34)}
.browser-open-card button:hover,.browser-open-card a:hover{background:rgba(255,255,255,.15)}
.browser-shortcuts{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:18px}
.browser-shortcuts button{border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;padding:8px 12px;cursor:pointer}
.browser-shortcuts button:hover{background:rgba(255,255,255,.12)}

@media (max-width:720px){
  .browser-toolbar{flex-wrap:wrap;gap:6px;padding:7px}
  .browser-toolbar .address-wrap{order:2;flex:0 0 100%}
  .browser-address{height:36px}
  .browser-go{top:4px}
}
@media (max-width:520px){
  #browserForward,#browserHomeBtn,#browserProfile{display:none}
  .browser-mode{margin-left:auto}
  .browser-open-card{padding:20px}
  .browser-open-card h3{font-size:20px}
}


/* Genesis admin + global announcement system */
.genesis-id-badge{
  position:fixed;
  top:12px;
  right:14px;
  left:auto;
  transform:none;
  z-index:1000000;
  padding:7px 11px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.20);
  background:rgba(6,10,18,.42);
  color:rgba(255,255,255,.84);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  font-size:12px;
  font-weight:700;
  letter-spacing:.10em;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  pointer-events:none;
  user-select:none
}
.genesis-announcement{
  position:fixed;
  top:14px;
  left:50%;
  z-index:2147483000;
  width:min(760px,calc(100vw - 32px));
  box-sizing:border-box;
  transform:translate(-50%,-26px) scale(.985);
  opacity:0;
  pointer-events:none;
  padding:13px 18px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(10,14,24,.88);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  color:white;
  text-align:center;
  font-size:13px;
  font-weight:600;
  line-height:1.5;
  transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.2,1)
}
.genesis-announcement.show{opacity:1;transform:translate(-50%,0) scale(1)}
.admin-panel{padding:24px}
.admin-panel textarea,.admin-panel input{
  width:100%;border:1px solid rgba(255,255,255,.11);outline:0;
  border-radius:16px;background:rgba(255,255,255,.055);color:white;
  padding:13px 15px
}
.admin-panel textarea{min-height:150px;resize:vertical;line-height:1.55}
.admin-panel input{height:46px}
.admin-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.admin-status{min-height:21px;margin-top:10px;color:var(--muted);font-size:11px}
.admin-list{margin-top:18px;display:grid;gap:8px}
.admin-device{
  display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;
  padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.04)
}
.admin-device .device-id{font-weight:750}
.status-active{color:#7dffac}.status-off{color:#ff8f9e}
.admin-history{margin-top:22px}
.admin-history-item{font-size:11px;color:var(--muted);padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.genesis-blocked{
  position:fixed;inset:0;z-index:1000000;display:grid;place-items:center;
  background:#060810;color:#fff;text-align:center;padding:30px
}
.genesis-blocked-card{
  width:min(500px,92vw);padding:36px;border-radius:26px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)
}

(function(){
  try{
    const login = JSON.parse(localStorage.getItem("genesisLogin") || "null");
    if(login && login.expires && Date.now() < login.expires){
      sessionStorage.setItem("realmAuth","1");
      sessionStorage.setItem("realmUser",login.user || "");
      sessionStorage.setItem("genesisRole",login.role || "user");
      return;
    }
  }catch(e){}
  location.replace("index.html");
})();
</script>

const embeddedGameUrls = Object.create(null);

function base64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function shouldConvertGameSourceToHTML(url){
  try{
    const u = new URL(url, location.href);
    return (
      u.hostname === "cdn.jsdelivr.net" &&
      (
        u.pathname.includes("/npm/ugs-singlefiles") ||
        u.pathname.includes("/gh/bubbls/ugs-singlefile") ||
        u.pathname.includes("/gh/seanstonator-lang/UGS-Web-Hub")
      )
    );
  }catch{
    return false;
  }
}

function addGameBaseTag(htmlText, sourceUrl){
  // Preserve a game's own asset base. The first <base> element wins, so
  // injecting another one before a Unity/WebGL port breaks its Build files.
  if(/<base\s[^>]*href\s*=/i.test(htmlText)) return htmlText;

  const baseHref = new URL(".", sourceUrl).href;
  const baseTag = `<base href="${baseHref.replace(/"/g,"&quot;")}">`;

  if(/<head[\s>]/i.test(htmlText)){
    return htmlText.replace(/<head([^>]*)>/i, `<head$1>${baseTag}`);
  }

  if(/<html[\s>]/i.test(htmlText)){
    return htmlText.replace(/<html([^>]*)>/i, `<html$1><head>${baseTag}</head>`);
  }

  return `<!doctype html><html><head>${baseTag}</head><body>${htmlText}</body></html>`;
}

async function fetchGameHTMLAsBlob(sourceUrl){
  const response = await fetch(sourceUrl, {
    method:"GET",
    mode:"cors",
    cache:"force-cache",
    signal:typeof AbortSignal?.timeout==="function"?AbortSignal.timeout(20000):undefined
  });

  if(!response.ok){
    throw new Error(`Game source returned HTTP ${response.status}`);
  }

  let htmlText = await response.text();

  // jsDelivr sometimes serves these .html files as text/plain.
  // Re-wrapping the response in a text/html Blob makes the iframe execute
  // the document instead of displaying its source code.
  htmlText = addGameBaseTag(htmlText, sourceUrl);

  const blob = new Blob([htmlText], {type:"text/html;charset=utf-8"});
  return URL.createObjectURL(blob);
}

async function unpackEmbeddedGame(gameId){
  if(embeddedGameUrls[gameId]) return embeddedGameUrls[gameId];

  const game = gameLibrary.find(g => g.id === gameId);

  if(game && game.src){
    const sources=Array.isArray(game.sources)&&game.sources.length?game.sources:[game.src];
    let lastError=null;
    for(const source of sources){
      try{
        if(shouldConvertGameSourceToHTML(source)){
          const blobUrl = await fetchGameHTMLAsBlob(source);
          embeddedGameUrls[gameId] = blobUrl;
          return blobUrl;
        }

        // Local pages and special public ports can load normally.
        return source;
      }catch(err){
        lastError=err;
        console.warn("Genesis game source failed, trying its mirror.",source,err);
      }
    }
    throw lastError||new Error("No working source is available for "+game.name+".");
  }

  const payload = embeddedGamePayloads[gameId];
  if(!payload) throw new Error("Missing embedded game: " + gameId);

  let htmlText;

  if(typeof DecompressionStream === "function"){
    const bytes = base64ToBytes(payload);
    const decompressed = new Blob([bytes])
      .stream()
      .pipeThrough(new DecompressionStream("gzip"));
    htmlText = await new Response(decompressed).text();
  }else{
    throw new Error(
      "This browser does not support DecompressionStream, which this portable build uses to unpack games."
    );
  }

  const blob = new Blob([htmlText], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  embeddedGameUrls[gameId] = url;
  return url;
}


function gameWebSearchThumb(name){
  // Uses a real web image-search thumbnail for the game name; no generated art.
  return "https://tse1.mm.bing.net/th?q="
    + encodeURIComponent(name + " game cover official icon")
    + "&w=640&h=400&c=7&rs=1&p=0&dpr=1&pid=1.7&mkt=en-US&adlt=moderate";
}

function catalogGame(entry){
  const primary=new URL(entry.file,GENESIS_GAME_CDN_BASE).href;
  const fallback=new URL(entry.file,GENESIS_GAME_PAGES_BASE).href;
  return{
    id:entry.id,
    name:entry.name,
    developer:"UGS · "+entry.section,
    section:entry.section,
    thumb:gameWebSearchThumb(entry.name),
    src:primary,
    sources:[primary,fallback]
  };
}

  return `<div class="game-request-shell" id="gameRequestShell">
    <section class="gr-scene active" data-step="game">
      <div class="gr-inner">

function initGameRequest(){
  const shell=document.getElementById("gameRequestShell");
  if(!shell)return;

  const game=document.getElementById("grGame");
  const user=document.getElementById("grUser");

  game?.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();gameRequestNext("game")}
  });
  user?.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();gameRequestNext("user")}
  });

  setTimeout(()=>game?.focus(),180);
}

function grShowStep(next){
  const shell=document.getElementById("gameRequestShell");
  if(!shell)return;

  const current=shell.querySelector(".gr-scene.active");
  const target=shell.querySelector(`[data-step="${next}"]`);
  if(!target)return;

  if(current){
    current.classList.add("leaving");
    current.classList.remove("active");
  }

  setTimeout(()=>{
    current?.classList.remove("leaving");
    target.classList.add("active");

    if(next==="user") document.getElementById("grUser")?.focus();
  },610);
}

function gameRequestNext(step){
  if(step==="game"){
    const value=(document.getElementById("grGame")?.value||"").trim();
    if(!value){
      document.getElementById("grGame")?.focus();
      return;
    }
    grShowStep("user");
    return;
  }

  if(step==="user"){
    const value=(document.getElementById("grUser")?.value||"").trim();
    if(!value){
      document.getElementById("grUser")?.focus();
      return;
    }

    const game=(document.getElementById("grGame")?.value||"").trim();
    document.getElementById("grSummary").textContent =
      `${game} · Requested by ${value}`;

    grShowStep("done");
  }
}

function grStatus(title,copy,icon="✓",allowReset=true){
  const inner=document.getElementById("grStatusInner");
  if(!inner)return;
  inner.innerHTML=`
    <div class="gr-status-icon">${icon}</div>
    <div class="gr-status-title">${title}</div>
    <div class="gr-status-copy">${copy}</div>
    ${allowReset?`<button class="gr-reset" onclick="resetGameRequest()">Send another request</button>`:""}
  `;
  grShowStep("status");
}

function resetGameRequest(){
  const game=document.getElementById("grGame");
  const user=document.getElementById("grUser");
  if(game)game.value="";
  if(user)user.value="";

  const shell=document.getElementById("gameRequestShell");
  shell?.querySelectorAll(".gr-scene").forEach(x=>x.classList.remove("active","leaving"));
  const first=shell?.querySelector('[data-step="game"]');
  first?.classList.add("active");
  setTimeout(()=>game?.focus(),150);
}

function submitGameRequest(){
  const game=(document.getElementById("grGame")?.value||"").trim();
  const username=(document.getElementById("grUser")?.value||"").trim();

  if(!game||!username){
    grStatus("Missing Answer","Please fill out both questions before sending.","!");
    return;
  }

  // Google Forms requires the hidden entry IDs for each question.
  if(!GAME_REQUEST_FORM.gameEntry||!GAME_REQUEST_FORM.userEntry){
    // Keep a local copy so the request is not lost while the Google Form link is being connected.
    const pending=JSON.parse(localStorage.getItem("realmGameRequestPending")||"[]");
    pending.push({game,username,time:new Date().toISOString()});
    localStorage.setItem("realmGameRequestPending",JSON.stringify(pending));

    grStatus(
      "Almost Ready",
      "The Game Request app is installed, but the Google Form still needs its two hidden field IDs. Your request was saved on this device for now.",
      "…"
    );
    return;
  }

  // Submit invisibly to Google Forms. The normal Google Forms UI never opens.
  const iframe=document.createElement("iframe");
  iframe.name="realmGameRequestTarget_"+Date.now();
  iframe.style.display="none";
  document.body.appendChild(iframe);

  const form=document.createElement("form");
  form.method="POST";
  form.action=GAME_REQUEST_FORM.action;
  form.target=iframe.name;
  form.style.display="none";

  const add=(name,value)=>{
    const input=document.createElement("input");
    input.type="hidden";
    input.name=name;
    input.value=value;
    form.appendChild(input);
  };

  add(GAME_REQUEST_FORM.gameEntry,game);
  add(GAME_REQUEST_FORM.userEntry,username);

  document.body.appendChild(form);
  form.submit();

  grStatus(
    "Request Sent",
    "Your game request was sent. You can stay right here in Genesis.",
    "✓"
  );

  setTimeout(()=>{
    form.remove();
    iframe.remove();
  },8000);
}

function genesisGetMusicAudio(){
  if(genesisMusicAudio) return genesisMusicAudio;

  const audio = new Audio(GENESIS_MUSIC_TRACK.file);
  audio.preload = "metadata";

  const storedVolume = Number(localStorage.getItem("genesisMusicVolume"));
  audio.volume = Number.isFinite(storedVolume)
    ? Math.max(0, Math.min(1, storedVolume))
    : 0.75;

  audio.addEventListener("play", genesisUpdateMusicUI);
  audio.addEventListener("pause", genesisUpdateMusicUI);
  audio.addEventListener("timeupdate", genesisUpdateMusicUI);
  audio.addEventListener("durationchange", genesisUpdateMusicUI);
  audio.addEventListener("loadedmetadata", genesisUpdateMusicUI);
  audio.addEventListener("ended", genesisUpdateMusicUI);
  audio.addEventListener("error", ()=>{
    const status=document.getElementById("musicNow");
    if(status) status.textContent="Could not load the music file.";
  });

  genesisMusicAudio = audio;
  return audio;
}

function genesisFormatTime(seconds){
  if(!Number.isFinite(seconds) || seconds < 0) return "0:00";
  const mins=Math.floor(seconds/60);
  const secs=Math.floor(seconds%60);
  return mins+":"+String(secs).padStart(2,"0");
}

function initMusicPlayer(){
  const audio=genesisGetMusicAudio();
  const seek=document.getElementById("musicSeek");
  const volume=document.getElementById("musicVolume");

  if(seek && !seek.dataset.bound){
    seek.dataset.bound="1";

    seek.addEventListener("input",()=>{
      if(!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      const target=(Number(seek.value)/1000)*audio.duration;
      document.getElementById("musicCurrent").textContent=genesisFormatTime(target);
    });

    seek.addEventListener("change",()=>{
      if(!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      audio.currentTime=(Number(seek.value)/1000)*audio.duration;
      genesisUpdateMusicUI();
    });
  }

  if(volume && !volume.dataset.bound){
    volume.dataset.bound="1";
    volume.value=String(audio.volume);

    volume.addEventListener("input",()=>{
      audio.volume=Number(volume.value);
      localStorage.setItem("genesisMusicVolume",String(audio.volume));
      genesisUpdateMusicUI();
    });
  }

  clearInterval(genesisMusicUiTimer);
  genesisMusicUiTimer=setInterval(()=>{
    if(openWindows.music) genesisUpdateMusicUI();
  },500);

  genesisUpdateMusicUI();
}

async function genesisMusicToggle(){
  const audio=genesisGetMusicAudio();

  if(audio.paused){
    try{
      await audio.play();
    }catch(error){
      const status=document.getElementById("musicNow");
      if(status) status.textContent="Press Play again if your browser blocked playback.";
    }
  }else{
    audio.pause();
  }

  genesisUpdateMusicUI();
}

function genesisMusicSkip(seconds){
  const audio=genesisGetMusicAudio();
  const duration=Number.isFinite(audio.duration) ? audio.duration : Infinity;
  audio.currentTime=Math.max(0,Math.min(duration,audio.currentTime+seconds));
  genesisUpdateMusicUI();
}

function genesisUpdateMusicUI(){
  const audio=genesisGetMusicAudio();
  const playButton=document.getElementById("musicPlayButton");
  const current=document.getElementById("musicCurrent");
  const duration=document.getElementById("musicDuration");
  const seek=document.getElementById("musicSeek");
  const volume=document.getElementById("musicVolume");
  const volumeText=document.getElementById("musicVolumeText");
  const status=document.getElementById("musicNow");

  if(playButton) playButton.textContent=audio.paused ? "▶" : "❚❚";
  if(current) current.textContent=genesisFormatTime(audio.currentTime);
  if(duration) duration.textContent=genesisFormatTime(audio.duration);

  if(seek && document.activeElement !== seek){
    seek.value=(Number.isFinite(audio.duration) && audio.duration>0)
      ? String(Math.round((audio.currentTime/audio.duration)*1000))
      : "0";
  }

  if(volume && document.activeElement !== volume) volume.value=String(audio.volume);
  if(volumeText) volumeText.textContent=Math.round(audio.volume*100)+"%";

  if(status){
    status.textContent=audio.paused
      ? (audio.currentTime>0 ? "Paused" : "Ready")
      : "Now Playing";
  }
}

function openApp(appId){
  const existing = openWindows[appId];
  if(existing){
    existing.classList.remove("minimized");
    focusWindow(existing);
    return;
  }
  const app = apps[appId];
  if(!app) return;
  if(app.adminOnly && genesisRole() !== "admin") return;
  const win = document.createElement("section");
  win.className = "window";
  win.dataset.app = appId;
  const content = typeof app.content === "function" ? app.content() : app.content;
  win.innerHTML = `<div class="window-header">
    <div class="window-controls">
      <button class="window-control close" aria-label="Close"></button>
      <button class="window-control minimize" aria-label="Minimize"></button>
      <button class="window-control maximize" aria-label="Maximize"></button>
    </div>
    <div class="window-title">${app.title}</div>
  </div><div class="window-content">${content}</div>`;
  document.getElementById("os").appendChild(win);
  openWindows[appId] = win;
  focusWindow(win);
  makeWindowDraggable(win);
  if(appId==="gameRequest") setTimeout(initGameRequest,0);
  if(appId==="deactivateOS") setTimeout(refreshDeactivateOS,0);
  if(appId==="announcement") setTimeout(()=>document.getElementById("announcementText")?.focus(),0);
  if(appId==="music") setTimeout(initMusicPlayer,0);
  if(appId==="messages") setTimeout(()=>window.GenesisMessages?.init?.(),0);

  win.querySelector(".close").onclick = e => {e.stopPropagation(); closeWindow(appId,win)};
  win.querySelector(".minimize").onclick = e => {e.stopPropagation(); win.classList.add("minimized")};
  win.querySelector(".maximize").onclick = e => {e.stopPropagation(); toggleMaximize(win)};
  win.addEventListener("pointerdown",()=>focusWindow(win));

  setDockRunning(appId,true);

  if(appId==="notes"){
    const area=win.querySelector("#notesArea");
    area.value=localStorage.getItem("realmOsNotes")||"";
    area.addEventListener("input",()=>localStorage.setItem("realmOsNotes",area.value));
  }
  if(appId==="browser") initBrowser(win);
}

function closeWindow(appId,win){
  if(appId==="messages") window.GenesisMessages?.onWindowClose?.();
  if(appId==="browser"){
    captureBrowserLocation(win);
    persistBrowserState(false);
    browserState.navigationId++;
    if(browserState.loadTimer) clearTimeout(browserState.loadTimer);
    if(browserState.settleTimer) clearTimeout(browserState.settleTimer);
    Object.assign(browserState,{
      currentPopout:"",
      prismFrame:null,
      prismError:"",
      loadTimer:null,
      settleTimer:null,
      frameMode:"home",
      currentRoute:null
    });
  }
  win.classList.add("closing");
  setTimeout(()=>{
    win.remove();
    delete openWindows[appId];
    setDockRunning(appId,false);
  },180);
}
function focusWindow(win){highestZ++;win.style.zIndex=highestZ}
function toggleMaximize(win){win.classList.toggle("maximized")}

function makeWindowDraggable(win){
  const header=win.querySelector(".window-header");
  let dragging=false,startX=0,startY=0,left=0,top=0;
  header.addEventListener("pointerdown",e=>{
    if(e.target.closest(".window-controls")||win.classList.contains("maximized")) return;
    dragging=true;focusWindow(win);
    const r=win.getBoundingClientRect();
    win.style.left=r.left+"px";win.style.top=r.top+"px";win.style.transform="none";
    left=r.left;top=r.top;startX=e.clientX;startY=e.clientY;
    header.setPointerCapture(e.pointerId);
  });
  header.addEventListener("pointermove",e=>{
    if(!dragging) return;
    let x=left+e.clientX-startX,y=top+e.clientY-startY;
    x=Math.max(0,Math.min(x,window.innerWidth-win.offsetWidth-8));
    y=Math.max(0,Math.min(y,window.innerHeight-65));
    win.style.left=x+"px";win.style.top=y+"px";
  });
  header.addEventListener("pointerup",()=>dragging=false);
  header.addEventListener("dblclick",e=>{if(!e.target.closest(".window-controls"))toggleMaximize(win)});
}

icons.forEach(icon=>{
  const id=icon.dataset.app;
  const saved=localStorage.getItem("realmOsIcon_"+id);
  if(saved){try{const p=JSON.parse(saved);icon.style.left=p.x+"px";icon.style.top=p.y+"px"}catch{}}
  let dragging=false,moved=false,sx=0,sy=0,bx=0,by=0;
  icon.addEventListener("pointerdown",e=>{
    icons.forEach(i=>i.classList.remove("selected"));icon.classList.add("selected");
    dragging=true;moved=false;sx=e.clientX;sy=e.clientY;bx=parseFloat(icon.style.left)||0;by=parseFloat(icon.style.top)||0;
    icon.classList.add("dragging");icon.setPointerCapture(e.pointerId);
  });
  icon.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;
    const x=Math.max(0,Math.min(desktop.clientWidth-icon.offsetWidth,bx+dx));
    const y=Math.max(0,Math.min(desktop.clientHeight-icon.offsetHeight,by+dy));
    icon.style.left=x+"px";icon.style.top=y+"px";
  });
  icon.addEventListener("pointerup",()=>{
    dragging=false;icon.classList.remove("dragging");
    if(moved)localStorage.setItem("realmOsIcon_"+id,JSON.stringify({x:parseFloat(icon.style.left),y:parseFloat(icon.style.top)}));
  });
  icon.addEventListener("dblclick",()=>{if(!moved)openApp(id)});
});
desktop.addEventListener("pointerdown",e=>{if(e.target===desktop)icons.forEach(i=>i.classList.remove("selected"))});

const GAME_RENDER_BATCH=120;

function matchingGames(query=""){
  const normalized=String(query||"").trim().toLowerCase();
  if(!normalized)return gameLibrary;
  return gameLibrary.filter(game=>
    (game.name+" "+game.developer+" "+(game.section||"")).toLowerCase().includes(normalized)
  );
}

function gamesHTML(){

function gameCardHTML(g){
  return `<article class="game-card" data-game-id="${g.id}" data-search="${escapeHTML((g.name+" "+g.developer+" "+(g.section||"")).toLowerCase())}" onclick="openGame('${g.id}')">

  </article>`;
}
function filterGames(q){
  gameSearchQuery=String(q||"");
  gameVisibleLimit=GAME_RENDER_BATCH;
  renderGameResults();
}
function showMoreGames(){
  gameVisibleLimit+=GAME_RENDER_BATCH;
  renderGameResults();
}
function renderGameResults(){
  const games=matchingGames(gameSearchQuery);
  const shown=games.slice(0,gameVisibleLimit);
  const grid=document.getElementById("gamesGrid");
  const count=document.getElementById("gamesCount"),none=document.getElementById("noGames");
  const more=document.getElementById("gamesMore");
  if(grid)grid.innerHTML=shown.map(gameCardHTML).join("");
  if(count)count.textContent=games.length+" game"+(games.length===1?"":"s");
  if(none)none.style.display=games.length?"none":"block";
  if(more){
    more.style.display=shown.length<games.length?"block":"none";
    more.textContent="Show more · "+shown.length+" of "+games.length;
  }
}
async function openGame(gameId){
  const g=gameLibrary.find(x=>x.id===gameId);
  if(!g)return;

  if(g.page){
    location.href=new URL(g.page,location.href).href;
    return;
  }

  if(!openWindows.games)openApp("games");

  const win=openWindows.games;
  const content=win.querySelector(".window-content");
  const title=win.querySelector(".window-title");

  title.textContent=g.name;

  content.innerHTML=`<div class="player">
    <div class="player-toolbar">
      <button class="os-btn" onclick="showGamesLibrary()">← Back</button>
      <div class="player-name">${escapeHTML(g.name)}</div>
      <button class="os-btn" onclick="reloadGame()">↻ Reload</button>
      <button class="os-btn" onclick="fullscreenGame()">⛶ Fullscreen</button>
    </div>
    <div class="player-stage">
      <div class="loader" id="gameLoader">
        <div class="loader-inner">
          <div class="spinner"></div>
          <div id="gameLoadText">Preparing ${escapeHTML(g.name)}...</div>
        </div>
      </div>
      <iframe
        id="gameFrame"
        class="player-frame"
        allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; pointer-lock"
        allowfullscreen
      ></iframe>
    </div>
  </div>`;

  focusWindow(win);

  const frame=document.getElementById("gameFrame");
  const loader=document.getElementById("gameLoader");
  const loadText=document.getElementById("gameLoadText");

  try{
    if(loadText) loadText.textContent="Preparing "+g.name+"...";
    const gameUrl=await unpackEmbeddedGame(gameId);

    frame.addEventListener("load",()=>{
      if(loader)setTimeout(()=>loader.classList.add("hidden"),350);
    },{once:true});

    if(loadText) loadText.textContent="Loading "+g.name+"...";
    frame.src=gameUrl;
  }catch(err){

const GENESIS_BROWSER_STATE_KEY="genesisBrowserStateV2";

function validSavedBrowserAddress(value){
  if(value==="os://home")return value;
  try{
    const parsed=new URL(String(value||""));
    return parsed.protocol==="https:"||parsed.protocol==="http:"?parsed.href:"";
  }catch{return "";}
}

function loadSavedBrowserState(){
  try{
    const saved=JSON.parse(localStorage.getItem(GENESIS_BROWSER_STATE_KEY)||"null");
    const history=Array.isArray(saved?.history)
      ?saved.history.map(validSavedBrowserAddress).filter(Boolean).slice(-30)
      :[];
    if(!history.length)history.push("os://home");
    const index=Math.max(0,Math.min(history.length-1,Number(saved?.index)||0));
    return{history,index,open:saved?.open===true};
  }catch{return{history:["os://home"],index:0,open:false};}
}

const savedBrowserState=loadSavedBrowserState();
const browserState={
  history:savedBrowserState.history,
  index:savedBrowserState.index,
  mode:"proxy",
  profile:"brave",
  currentPopout:"",
  prismFrame:null,
  prismError:"",
  loadTimer:null,
  settleTimer:null,
  youtubeFallbackTimer:null,
  frameMode:"home",
  currentRoute:null,
  navigationId:0,
  restoreOnStartup:savedBrowserState.open
};

function persistBrowserState(open=openWindows.browser instanceof Element){
  try{
    localStorage.setItem(GENESIS_BROWSER_STATE_KEY,JSON.stringify({
      history:browserState.history.slice(-30),
      index:Math.max(0,Math.min(browserState.history.length-1,browserState.index)),
      open:!!open,
      updatedAt:Date.now()
    }));
  }catch{}
}

function decodeGenesisProxyAddress(value){
  const direct=validSavedBrowserAddress(value);
  if(direct && new URL(direct).origin!==location.origin)return direct;
  try{
    const parsed=new URL(String(value||""),location.href);
    const marker="/prism/";
    const markerIndex=parsed.pathname.indexOf(marker);
    if(markerIndex<0)return "";
    const routed=parsed.pathname.slice(markerIndex+marker.length);
    const split=routed.indexOf("/");
    if(split<0)return "";
    return validSavedBrowserAddress(decodeURIComponent(routed.slice(split+1)));
  }catch{return "";}
}

function captureBrowserLocation(win=openWindows.browser){
  if(!win||browserState.frameMode!=="proxy")return "";
  const frame=win.querySelector("#browserFrame");
  let value="";
  try{value=decodeGenesisProxyAddress(frame?.contentWindow?.location?.href||frame?.src||"");}catch{}
  if(!value)return "";
  const current=browserState.history[browserState.index];
  if(current!==value){
    browserState.history=browserState.history.slice(0,browserState.index+1);
    browserState.history.push(value);
    browserState.index=browserState.history.length-1;
    const address=win.querySelector("#browserAddress");
    if(address)address.value=value;
    updateBrowserButtons();
  }
  persistBrowserState(true);
  return value;
}

async function ensureGenesisPrism(win){
  if(browserState.prismFrame) return browserState.prismFrame;
  const status=win?.querySelector("#browserStatus");
  const frame=win?.querySelector("#browserFrame");
  if(!frame) throw new Error("Browser frame is missing.");
  if(openWindows.browser!==win) throw new Error("Browser window was closed.");
  try{
    if(status) status.textContent="Starting Scramjet + Wisp proxy…";
    const prismFrame=await window.GenesisPrism.createFrame(frame);
    if(openWindows.browser!==win) throw new Error("Browser window was closed.");
    browserState.prismFrame=prismFrame;
    browserState.prismError="";
    if(status) status.textContent="Ready · Scramjet proxy connected";
    return prismFrame;
  }catch(err){
    console.error("Genesis Prism failed to start",err);
    browserState.prismError=err?.message||String(err);
    if(status) status.textContent="Scramjet proxy unavailable · "+browserState.prismError;
    throw err;
  }
}

function initBrowser(win){
  const address=win.querySelector("#browserAddress");
  const go=win.querySelector("#browserGo");
  const back=win.querySelector("#browserBack");
  const forward=win.querySelector("#browserForward");
  const reload=win.querySelector("#browserReload");
  const home=win.querySelector("#browserHomeBtn");
  const external=win.querySelector("#browserExternal");
  const aboutBlank=win.querySelector("#browserAboutBlank");
  const mode=win.querySelector("#browserMode");
  const profile=win.querySelector("#browserProfile");
  const openDirect=win.querySelector("#browserOpenDirect");
  const tryInside=win.querySelector("#browserTryInside");
  const frame=win.querySelector("#browserFrame");
  const officialFrame=win.querySelector("#browserOfficialFrame");
  const status=win.querySelector("#browserStatus");

  if(profile) profile.textContent="Brave";
  const restoredAddress=browserState.history[browserState.index]||"os://home";
  address.value=restoredAddress;

  go.onclick=()=>browserNavigate(address.value,true,true);
  address.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      browserNavigate(address.value,true,true);
    }
  });

  back.onclick=()=>{
    if(browserState.index>0){
      browserState.index--;
      browserNavigate(browserState.history[browserState.index],false,true);
    }
  };

  forward.onclick=()=>{
    if(browserState.index<browserState.history.length-1){
      browserState.index++;
      browserNavigate(browserState.history[browserState.index],false,true);
    }
  };

  reload.onclick=()=>browserReload();
  home.onclick=()=>browserNavigate("os://home",true,false);

  external.onclick=()=>{
    const current=browserState.history[browserState.index];
    if(current && current!=="os://home") openGenesisTab(current);
  };

  aboutBlank.onclick=()=>{
    const opened=openAboutBlankShell(new URL("os.html",location.href).href,"Genesis");
    status.textContent=opened
      ?"Genesis opened in About Blank"
      :"About Blank was blocked · allow this popup and try again";
  };

  mode.onclick=()=>{
    browserState.mode=browserState.mode==="tab"?"proxy":"tab";
    mode.textContent=browserState.mode==="tab"?"Genesis Tab":"Inside OS";
    mode.classList.toggle("embed",browserState.mode==="proxy");
    status.textContent=browserState.mode==="tab"
      ?"Genesis Tab mode · websites open in a dedicated proxy tab"
      :(browserState.prismError?"Embedded browser unavailable · "+browserState.prismError:"Inside OS mode · ready");
  };

  openDirect.addEventListener("click",event=>{
    const current=browserState.history[browserState.index];
    if(!current || current==="os://home") return;
    try{
      const launchUrl=createGenesisTabLaunch(current);
      openDirect.href=launchUrl;
      const opened=openAboutBlankShell(launchUrl,"Genesis Browser");
      if(opened){
        event.preventDefault();
        status.textContent="Opened website in About Blank";
      }
    }catch(err){
      event.preventDefault();
      status.textContent="Could not prepare a Genesis browser tab";
    }
  });

  tryInside.onclick=()=>{
    const current=browserState.history[browserState.index];
    if(current && current!=="os://home"){
      browserState.mode="proxy";
      mode.textContent="Inside OS";
      mode.classList.add("embed");
      browserNavigate(current,false,true,{forceProxy:true});
    }
  };

  win.querySelectorAll("[data-browser-url]").forEach(button=>{
    button.addEventListener("click",()=>browserNavigate(button.dataset.browserUrl,true,true));
  });

  frame.addEventListener("load",()=>{
    if(browserState.loadTimer){clearTimeout(browserState.loadTimer);browserState.loadTimer=null;}
    if(browserState.settleTimer){clearTimeout(browserState.settleTimer);browserState.settleTimer=null;}
    const current=browserState.history[browserState.index];
    if(browserState.frameMode==="official"){
      status.textContent=(browserState.currentRoute?.label||"Media")+" player ready";
      return;
    }
    if(browserState.frameMode==="proxy" && current && current!=="os://home"){
      status.textContent="Page connected · finishing scripts and images…";
      repairEmbeddedPage(win);
      setTimeout(()=>captureBrowserLocation(win),0);
      scheduleYouTubePlayerFallback(win,current);
      browserState.settleTimer=setTimeout(()=>{
        if(browserState.history[browserState.index]===current)
          status.textContent="Loaded · "+current;
      },2200);
    }
  });
  officialFrame?.addEventListener("load",()=>{
    if(browserState.frameMode!=="official")return;
    status.textContent=(browserState.currentRoute?.label||"Media")+" player ready · inside Genesis";
  });

  updateBrowserButtons();
  persistBrowserState(true);
  status.textContent=restoredAddress==="os://home"?"Ready · Brave Search":"Restoring · "+restoredAddress;
  if(restoredAddress!=="os://home"){
    setTimeout(()=>browserNavigate(restoredAddress,false,false,{forceProxy:true}),0);
  }
}

function browserSearchURL(query){
  return "https://search.brave.com/search?q="+encodeURIComponent(query);
}

function normalizeURL(raw){
  raw=String(raw||"").trim();
  if(!raw||raw==="os://home")return"os://home";
  if(/^https?:\/\//i.test(raw))return raw;

  const looksLikeSearch =
    /\s/.test(raw) ||
    (!raw.includes(".") && !/^localhost(?::\d+)?(?:\/|$)/i.test(raw));

  if(looksLikeSearch) return browserSearchURL(raw);
  return "https://"+raw;
}

function getCompatibilityRoute(url){
  let label="website";
  try{label=new URL(url).hostname.replace(/^www\./,"")||"website";}catch{}
  // Every normal address follows the same Scramjet + Wisp pipeline. The
  // dedicated Genesis Tab button remains available when a full-size view is
  // better, but site-specific direct embeds no longer bypass Scramjet.
  return{kind:"proxy",label,transport:"wisp"};
}

function clearYouTubeFallbackTimer(){
  if(browserState.youtubeFallbackTimer)clearTimeout(browserState.youtubeFallbackTimer);
  browserState.youtubeFallbackTimer=null;
}

function youtubePlayerFallbackRoute(url,reason=""){
  const fallbacks=window.GenesisPrism?.youtubeEmbedFallbacks?.(url)||[];
  if(!fallbacks.length)return null;
  return{
    kind:"official",
    label:"YouTube",
    src:fallbacks[0],
    fallbacks,
    fallbackIndex:0,
    reason,
    logicalUrl:url
  };
}

function inspectProxiedYouTubePlayer(frame){
  try{
    const doc=frame?.contentDocument;
    if(!doc?.body)return{playable:false,challenge:false};
    const text=(doc.body.innerText||"").replace(/\s+/g," ").trim();
    const video=doc.querySelector("video");
    return{
      playable:!!video&&(video.readyState>=2||video.buffered?.length>0),
      challenge:/sign in to confirm you(?:'|’)?re not a bot|confirm you(?:'|’)?re not a bot|unusual traffic/i.test(text)
    };
  }catch{return{playable:true,challenge:false};}
}

function scheduleYouTubePlayerFallback(win,url){
  clearYouTubeFallbackTimer();
  const route=youtubePlayerFallbackRoute(url);
  if(!route||browserState.frameMode!=="proxy")return;
  const frame=win?.querySelector("#browserFrame");
  const started=Date.now();
  const check=()=>{
    if(openWindows.browser!==win || browserState.frameMode!=="proxy" || browserState.history[browserState.index]!==url)return;
    const player=inspectProxiedYouTubePlayer(frame);
    if(player.playable)return;
    if(player.challenge || Date.now()-started>=11000){
      loadOfficialEmbed(win,url,{
        ...route,
        reason:player.challenge?"YouTube requested its official embedded player.":"The proxied video stream did not start in time."
      });
      return;
    }
    browserState.youtubeFallbackTimer=setTimeout(check,1400);
  };
  browserState.youtubeFallbackTimer=setTimeout(check,900);
}

function loadOfficialEmbed(win,url,route){
  clearYouTubeFallbackTimer();
  const frame=win.querySelector("#browserFrame");
  const officialFrame=win.querySelector("#browserOfficialFrame");
  const home=win.querySelector("#browserHome");
  const card=win.querySelector("#browserOpenCard");
  const status=win.querySelector("#browserStatus");

  browserState.frameMode="official";
  browserState.currentRoute=route;
  home.classList.add("hidden");
  card.classList.remove("show");
  frame.style.display="none";
  if(officialFrame){
    officialFrame.style.display="block";
    officialFrame.title=route.label+" player";
    officialFrame.src=route.src;
  }
  status.textContent="Opening "+route.label+" player inside Genesis…";
}

const GENESIS_BROWSER_LAUNCH_PREFIX="genesisBrowserLaunch:";

function openAboutBlankShell(destination,title="Genesis"){
  let opened=null;
  try{
    opened=window.open("about:blank","_blank");
    if(!opened)return null;

    const doc=opened.document;
    doc.title=title;
    doc.documentElement.style.cssText="width:100%;height:100%;margin:0;background:#050811;overflow:hidden";
    doc.body.style.cssText="width:100%;height:100%;margin:0;background:#050811;overflow:hidden";
    doc.body.replaceChildren();

    const viewport=doc.createElement("meta");
    viewport.name="viewport";
    viewport.content="width=device-width,initial-scale=1,viewport-fit=cover";
    doc.head.appendChild(viewport);

    const frame=doc.createElement("iframe");
    frame.title=title;
    frame.src=destination;
    frame.referrerPolicy="strict-origin-when-cross-origin";
    frame.allow="fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-read; clipboard-write; gamepad; pointer-lock; microphone; camera; display-capture";
    frame.allowFullscreen=true;
    frame.style.cssText="display:block;width:100%;height:100%;border:0;background:#050811";
    doc.body.appendChild(frame);
    try{opened.opener=null;}catch{}
    try{opened.focus();}catch{}
    return opened;
  }catch(err){
    try{opened?.close();}catch{}
    console.error("Genesis could not create the About Blank shell.",err);
    return null;
  }
}

function createGenesisTabLaunch(url){
  const now=Date.now();
  try{
    for(let i=localStorage.length-1;i>=0;i--){
      const key=localStorage.key(i);
      if(!key?.startsWith(GENESIS_BROWSER_LAUNCH_PREFIX)) continue;
      let entry=null;
      try{entry=JSON.parse(localStorage.getItem(key)||"null");}catch{}
      if(!entry?.expires || entry.expires<=now) localStorage.removeItem(key);
    }
  }catch{}

  let token="";
  try{
    token=crypto.randomUUID?.()||"";
    if(!token){
      const bytes=new Uint8Array(16);
      crypto.getRandomValues(bytes);
      token=[...bytes].map(value=>value.toString(16).padStart(2,"0")).join("");
    }
  }catch{
    token=Date.now().toString(36)+Math.random().toString(36).slice(2);
  }

  localStorage.setItem(GENESIS_BROWSER_LAUNCH_PREFIX+token,JSON.stringify({
    url,
    expires:now+15*60*1000
  }));

  const launch=new URL("browser-tab.html",location.href);
  launch.hash=token;
  return launch.href;
}

function repairEmbeddedPage(win){
  const frame=win?.querySelector("#browserFrame");
  if(!frame) return;

  let doc,pageWin;
  try{
    doc=frame.contentDocument;
    pageWin=frame.contentWindow;
    if(!doc || !pageWin) return;
  }catch{ return; }

  // Do NOT walk/mutate every image or observe the entire DOM. Large SPAs
  // (especially YouTube) continuously rebuild their page and the old repair
  // observer could keep the main thread busy enough to leave skeleton cards.
  // We only normalize existing new-tab targets once, then fix future clicks
  // at event time with constant work.
  try{
    doc.querySelectorAll("a[target='_blank'],a[target='_new'],area[target='_blank'],area[target='_new']")
      .forEach(a=>a.setAttribute("target","_self"));
    doc.querySelectorAll("form[target='_blank'],form[target='_new']")
      .forEach(f=>f.setAttribute("target","_self"));
  }catch{}

  if(!doc.__genesisSameTabHandler){
    doc.addEventListener("click",event=>{
      const a=event.target?.closest?.("a,area");
      if(!a) return;
      const target=(a.getAttribute("target")||"").toLowerCase();
      if(target==="_blank" || target==="_new") a.setAttribute("target","_self");
    },true);
    doc.addEventListener("submit",event=>{
      const form=event.target;
      if(!form?.getAttribute) return;
      const target=(form.getAttribute("target")||"").toLowerCase();
      if(target==="_blank" || target==="_new") form.setAttribute("target","_self");
    },true);
    doc.__genesisSameTabHandler=true;
  }

  if(!doc.__genesisStatePersistence){
    const syncLocation=()=>setTimeout(()=>{
      const next=captureBrowserLocation(win);
      if(next)scheduleYouTubePlayerFallback(win,next);
    },0);
    pageWin.addEventListener("popstate",syncLocation);
    pageWin.addEventListener("pagehide",syncLocation);
    doc.addEventListener("yt-navigate-finish",syncLocation,true);
    doc.__genesisStatePersistence=true;
  }

  // Keep ordinary script-created URL popups in the managed frame. Preserve
  // empty/about:blank windows because some sign-in and download flows use them
  // as temporary browser contexts.
  if(!pageWin.__genesisSameFrameOpen){
    try{
      const originalOpen=pageWin.open.bind(pageWin);
      pageWin.open=function(url,target,features){
        const value=String(url||"");
        const targetName=String(target||"_blank").toLowerCase();
        if(value && value!=="about:blank" && (targetName==="_blank" || targetName==="_new" || targetName==="")){
          return originalOpen(url,"_self",features);
        }
        return originalOpen(url,target,features);
      };
      pageWin.__genesisSameFrameOpen=true;
    }catch{}
  }
}

async function browserNavigate(raw,push,fromUser=false,options={}){
  const win=openWindows.browser;if(!win)return;
  const url=normalizeURL(raw);
  const navigationId=++browserState.navigationId;

  if(push && browserState.history[browserState.index]!==url){
    browserState.history=browserState.history.slice(0,browserState.index+1);
    browserState.history.push(url);
    browserState.index=browserState.history.length-1;
  }

  const addr=win.querySelector("#browserAddress");
  const frame=win.querySelector("#browserFrame");
  const officialFrame=win.querySelector("#browserOfficialFrame");
  const home=win.querySelector("#browserHome");
  const card=win.querySelector("#browserOpenCard");
  const status=win.querySelector("#browserStatus");

  addr.value=url;
  persistBrowserState(true);
  clearYouTubeFallbackTimer();
  card.classList.remove("show");
  if(browserState.settleTimer){clearTimeout(browserState.settleTimer);browserState.settleTimer=null;}

  if(url==="os://home"){
    browserState.frameMode="home";
    browserState.currentRoute=null;
    frame.style.display="none";
    if(officialFrame){
      officialFrame.style.display="none";
      officialFrame.src="about:blank";
    }
    home.classList.remove("hidden");
    status.textContent=browserState.prismError
      ?"Genesis Home · Scramjet proxy unavailable"
      :"Genesis Home · Scramjet proxy ready";
    updateBrowserButtons();
    return;
  }

  if(browserState.mode==="tab"){
    openGenesisTab(url,{label:"website",canTryInside:true});
    updateBrowserButtons();
    return;
  }

  const route=options.forceProxy?{kind:"proxy",label:"website"}:getCompatibilityRoute(url);
  browserState.currentRoute=route;
  if(route.kind==="official"){
    loadOfficialEmbed(win,url,route);
    updateBrowserButtons();
    return;
  }
  if(route.kind==="popout"){
    openGenesisTab(url,route);
    updateBrowserButtons();
    return;
  }

  try{
    const prismFrame=await ensureGenesisPrism(win);
    if(navigationId!==browserState.navigationId || openWindows.browser!==win) return;
    browserState.frameMode="proxy";
    home.classList.add("hidden");
    card.classList.remove("show");
    if(officialFrame){
      officialFrame.style.display="none";
      if(officialFrame.getAttribute("src")!=="about:blank")officialFrame.src="about:blank";
    }
    frame.style.display="block";
    status.textContent="Loading · "+url;
    if(browserState.loadTimer) clearTimeout(browserState.loadTimer);
    browserState.loadTimer=setTimeout(()=>{
      if(navigationId===browserState.navigationId && status)
        status.textContent="Still loading assets · waiting for the site to finish…";
    },18000);
    prismFrame.go(url);
  }catch(err){
    showPrismError(err?.message||String(err));
  }
  updateBrowserButtons();
}

async function browserReload(){
  const win=openWindows.browser;if(!win)return;
  const current=browserState.history[browserState.index];
  const navigationId=++browserState.navigationId;
  if(current==="os://home"){
    browserNavigate(current,false,false);
    return;
  }

  if(browserState.mode==="tab"){
    openGenesisTab(current);
    return;
  }

  if(browserState.frameMode==="official" && browserState.currentRoute?.src){
    const route=browserState.currentRoute;
    const fallbacks=Array.isArray(route.fallbacks)?route.fallbacks:[];
    if(fallbacks.length>1){
      const fallbackIndex=(Number(route.fallbackIndex||0)+1)%fallbacks.length;
      loadOfficialEmbed(win,current,{
        ...route,
        fallbackIndex,
        src:fallbacks[fallbackIndex],
        reason:"Trying another official YouTube player."
      });
    }else{
      loadOfficialEmbed(win,current,route);
    }
    return;
  }

  if(browserState.frameMode==="popout"){
    openGenesisTab(current,browserState.currentRoute||{});
    return;
  }

  const status=win.querySelector("#browserStatus");
  try{
    const prismFrame=await ensureGenesisPrism(win);
    if(navigationId!==browserState.navigationId || openWindows.browser!==win) return;
    status.textContent="Reloading · "+current;
    prismFrame.reload();
  }catch(err){
    showPrismError(err?.message||String(err));
  }
}

function updateBrowserButtons(){

function startWelcomeFireworks(){
  const canvas=document.getElementById("welcomeFireworks");
  if(!canvas || matchMedia("(prefers-reduced-motion: reduce)").matches){
    canvas?.classList.add("done");
    return;
  }
  const context=canvas.getContext("2d",{alpha:true});
  if(!context)return;
  let width=0,height=0,dpr=1,nextLaunch=0;
  const rockets=[],particles=[];
  const started=performance.now();
  const ends=started+15000;
  const resize=()=>{
    const rect=canvas.getBoundingClientRect();
    width=Math.max(1,rect.width);
    height=Math.max(1,rect.height);
    dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(width*dpr);
    canvas.height=Math.round(height*dpr);
    context.setTransform(dpr,0,0,dpr,0,0);
  };
  const launch=()=>{
    const hue=Math.floor(Math.random()*360);
    rockets.push({
      x:width*(.12+Math.random()*.76),
      y:height+8,
      target:height*(.08+Math.random()*.48),
      speed:4.2+Math.random()*2.2,
      hue,
      drift:(Math.random()-.5)*.25
    });
  };
  const explode=rocket=>{
    const count=18+Math.floor(Math.random()*10);
    for(let index=0;index<count;index++){
      const angle=(Math.PI*2*index/count)+Math.random()*.18;
      const speed=1.05+Math.random()*2.65;
      particles.push({
        x:rocket.x,y:rocket.y,
        previousX:rocket.x,previousY:rocket.y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        hue:(rocket.hue+Math.random()*38-19+360)%360,
        alpha:1,
        decay:.012+Math.random()*.013
      });
    }
    if(particles.length>260)particles.splice(0,particles.length-260);
  };
  const frame=now=>{
    const remaining=ends-now;
    context.clearRect(0,0,width,height);
    if(now>=nextLaunch && remaining>950){
      launch();
      nextLaunch=now+430+Math.random()*420;
    }
    for(let index=rockets.length-1;index>=0;index--){
      const rocket=rockets[index];
      const oldX=rocket.x,oldY=rocket.y;
      rocket.y-=rocket.speed;
      rocket.x+=rocket.drift;
      context.beginPath();
      context.moveTo(oldX,oldY);
      context.lineTo(rocket.x,rocket.y+10);
      context.strokeStyle=`hsla(${rocket.hue},100%,72%,.9)`;
      context.lineWidth=1.7;
      context.stroke();
      if(rocket.y<=rocket.target){
        explode(rocket);
        rockets.splice(index,1);
      }
    }
    const endingFade=Math.max(0,Math.min(1,remaining/900));
    context.save();
    context.globalAlpha=endingFade;
    for(let index=particles.length-1;index>=0;index--){
      const particle=particles[index];
      particle.previousX=particle.x;
      particle.previousY=particle.y;
      particle.x+=particle.vx;
      particle.y+=particle.vy;
      particle.vx*=.988;
      particle.vy=particle.vy*.988+.035;
      particle.alpha-=particle.decay;
      if(particle.alpha<=0){
        particles.splice(index,1);
        continue;
      }
      context.beginPath();
      context.moveTo(particle.previousX,particle.previousY);
      context.lineTo(particle.x,particle.y);
      context.strokeStyle=`hsla(${particle.hue},100%,72%,${particle.alpha})`;
      context.lineWidth=1.45;
      context.stroke();
    }
    context.restore();
    if(now<ends){
      requestAnimationFrame(frame);
    }else{
      context.clearRect(0,0,width,height);
      canvas.classList.add("done");
    }
  };
  resize();
  new ResizeObserver(resize).observe(canvas);
  launch();
  requestAnimationFrame(frame);
}
