/* =========================================================
   GENESIS GLOBAL BACKEND / ADMIN
========================================================= */

function genesisRole(){
  try{
    const login = JSON.parse(localStorage.getItem("genesisLogin") || "null");
    return login && login.expires > Date.now() ? (login.role || "user") : "user";
  }catch{return "user"}
}

function genesisBackendReady(){
  const b = window.GENESIS_BACKEND || {};
  return /^https:\/\/.+\.supabase\.co$/i.test(String(b.url || "")) &&
         String(b.anonKey || "").length > 20;
}


function genesisLocalDisplayId(){
  let id = localStorage.getItem("genesisDisplayId");
  if(id && /^\d{3}$/.test(id)) return id;

  // Gives the visitor a visible ID immediately, even before the backend replies.
  // When Supabase is configured, the registered shared ID replaces this value.
  id = String(Math.floor(100 + Math.random() * 900));
  localStorage.setItem("genesisDisplayId", id);
  return id;
}

function showGenesisIdImmediately(){
  const id = genesisLocalDisplayId();
  const badge = document.getElementById("genesisVisitorId");
  if(badge) badge.textContent = `ID ${id}`;
}

function genesisDeviceToken(){
  let token = localStorage.getItem("genesisDeviceToken");
  if(!token){
    token = crypto.randomUUID();
    localStorage.setItem("genesisDeviceToken", token);
  }
  return token;
}

async function genesisRpc(name, body, bearer){
  if(!genesisBackendReady()) throw new Error("Genesis backend is not configured");
  const b = window.GENESIS_BACKEND;
  const auth = bearer || b.anonKey;
  const response = await fetch(`${b.url}/rest/v1/rpc/${name}`, {
    method:"POST",
    headers:{
      "apikey":b.anonKey,
      "Content-Type":"application/json"
    },
    body:JSON.stringify(body || {})
  });
  if(!response.ok) throw new Error(await response.text());
  return response.json();
}

async function genesisPublicGet(path){
  const b = window.GENESIS_BACKEND;
  const response = await fetch(`${b.url}/rest/v1/${path}`, {
    headers:{
      "apikey":b.anonKey
    },
    cache:"no-store"
  });
  if(!response.ok) throw new Error(await response.text());
  return response.json();
}

async function genesisAdminSession(){
  let s;
  try{s = JSON.parse(localStorage.getItem("genesisAdminSession") || "null")}catch{}
  if(!s || !s.refresh_token) throw new Error("Admin session missing. Sign in again.");

  if(s.access_token && s.expires_at && Date.now() < s.expires_at - 60000){
    return s.access_token;
  }

  const b = window.GENESIS_BACKEND;
  const response = await fetch(`${b.url}/auth/v1/token?grant_type=refresh_token`, {
    method:"POST",
    headers:{"apikey":b.anonKey,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:s.refresh_token})
  });
  const data = await response.json();
  if(!response.ok || !data.access_token) throw new Error("Admin session expired. Sign in again.");

  s = {
    access_token:data.access_token,
    refresh_token:data.refresh_token || s.refresh_token,
    expires_at:Date.now() + ((data.expires_in || 3600) * 1000)
  };
  localStorage.setItem("genesisAdminSession", JSON.stringify(s));
  return s.access_token;
}

async function genesisAdminRequest(path, options={}){
  const b = window.GENESIS_BACKEND;
  const token = await genesisAdminSession();
  const headers = Object.assign({
    "apikey":b.anonKey,
    "Content-Type":"application/json"
  }, options.headers || {});
  const response = await fetch(`${b.url}/rest/v1/${path}`, Object.assign({}, options, {headers}));
  if(!response.ok) throw new Error(await response.text());
  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

function lockGenesis(displayId){
  localStorage.setItem("genesisDeviceBlocked", "1");
  if(displayId) localStorage.setItem("genesisDisplayId", String(displayId));

  // Kill the 12-hour login immediately. No Genesis password can be used
  // again on this browser until the ID is reactivated.
  localStorage.removeItem("genesisLogin");
  sessionStorage.clear();
  document.body.innerHTML = `<div class="genesis-blocked">
    <div class="genesis-blocked-card">
      <h1 style="margin:0 0 10px">Genesis Access Deactivated</h1>
      <div style="color:rgba(255,255,255,.58);line-height:1.6">
        This browser ID has been deactivated by an administrator.
      </div>
      <div style="margin-top:16px;font-size:12px;opacity:.5">ID ${escapeHTML(displayId || "")}</div>
    </div>
  </div>`;
}

async function ensureGenesisDevice(){
  if(!genesisBackendReady()) return;
  const rows = await genesisRpc("genesis_register_device", {p_token:genesisDeviceToken()});
  const d = Array.isArray(rows) ? rows[0] : rows;
  if(!d) return;
  localStorage.setItem("genesisDisplayId",String(d.display_id));
  const badge = document.getElementById("genesisVisitorId");
  if(badge) badge.textContent = `ID ${d.display_id}`;
  if(d.active === false){
    lockGenesis(d.display_id);
  }else{
    localStorage.removeItem("genesisDeviceBlocked");
  }
}

async function checkGenesisDevice(){
  if(!genesisBackendReady()) return;
  try{
    const rows = await genesisRpc("genesis_check_device", {p_token:genesisDeviceToken()});
    const d = Array.isArray(rows) ? rows[0] : rows;
    if(d && d.display_id){
      localStorage.setItem("genesisDisplayId",String(d.display_id));
      const badge=document.getElementById("genesisVisitorId");
      if(badge) badge.textContent=`ID ${d.display_id}`;
    }
    if(d && d.active === false){
      lockGenesis(d.display_id);
    }else if(d && d.active === true){
      const wasBlocked = localStorage.getItem("genesisDeviceBlocked") === "1";
      localStorage.removeItem("genesisDeviceBlocked");

      if(wasBlocked){
        location.replace("index.html");
      }
    }
  }catch(error){}
}

let genesisAnnouncementTimer = null;
let genesisLastAnnouncementId = null;

function showGenesisAnnouncement(message, ms, id){
  if(window.GenesisAnnouncements && typeof window.GenesisAnnouncements.show === "function"){
    window.GenesisAnnouncements.show(message, ms, id);
    return;
  }

  // Fallback if the shared script has not initialized yet.
  let banner = document.getElementById("genesisGlobalAnnouncement");
  if(!banner){
    banner = document.createElement("div");
    banner.id = "genesisGlobalAnnouncement";
    banner.style.cssText = "position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2147483647;padding:14px 20px;border-radius:18px;background:rgba(8,12,22,.94);color:white;font:600 14px Poppins,system-ui,sans-serif;";
    document.body.appendChild(banner);
  }
  banner.textContent = message;
  banner.style.display = "block";
  setTimeout(()=>{ banner.style.display = "none"; }, Math.max(2000, Number(ms)||7000));
}

async function pollGenesisAnnouncement(){
  if(!genesisBackendReady()) return;
  try{
    if(window.GenesisAnnouncements && typeof window.GenesisAnnouncements.poll === "function"){
      await window.GenesisAnnouncements.poll();
      return;
    }

    const rows = await genesisRpc("genesis_get_active_announcement", {});
    const a = Array.isArray(rows) ? rows[0] : rows;
    if(!a || !a.id || Number(a.remaining_ms) <= 0) return;

    if(String(a.id) !== String(genesisLastAnnouncementId)){
      genesisLastAnnouncementId = a.id;
      showGenesisAnnouncement(a.message, Number(a.remaining_ms));
    }
  }catch(error){
    console.warn("Genesis announcement check failed:", error);
  }
}

async function sendGenesisAnnouncement(){
  if(genesisRole() !== "admin") return;
  const input = document.getElementById("announcementText");
  const status = document.getElementById("announcementStatus");
  const message = (input?.value || "").trim();
  if(!message){
    if(status) status.textContent = "Type a message first.";
    return;
  }

  const duration = Math.min(22000, Math.max(5000, 3500 + (message.length * 55)));

  try{
    const sentId = await genesisRpc("genesis_send_announcement", {
      p_message: message,
      p_duration_ms: duration
    });
    if(status) status.textContent = `Sent · visible for about ${Math.ceil(duration/1000)} seconds`;
    input.value = "";

    // Always show it on the sender's screen immediately.
    showGenesisAnnouncement(message, duration, Array.isArray(sentId) ? sentId[0] : sentId);

    // Then tell the shared poller to pick up the database copy for everybody else.
    setTimeout(pollGenesisAnnouncement, 250);
  }catch(error){
    if(status) status.textContent = "Could not send announcement: " + error.message;
  }
}

async function setGenesisDevice(displayId, makeActive){
  if(genesisRole() !== "admin") return;
  const status = document.getElementById("deactivateStatus");
  const id = Number(displayId);
  if(!Number.isInteger(id) || id < 100 || id > 999){
    if(status) status.textContent = "Enter a valid three-digit ID.";
    return;
  }

  try{
    await genesisRpc("genesis_set_device_status", {
      p_display_id:id,
      p_active:!!makeActive
    });
    if(status) status.textContent = `ID ${id} ${makeActive ? "reactivated" : "deactivated"}.`;
    refreshDeactivateOS();
  }catch(error){
    if(status) status.textContent = "Could not update ID: " + error.message;
  }
}

function setGenesisDeviceFromInput(makeActive){
  const input = document.getElementById("deactivateIdInput");
  setGenesisDevice(input?.value, makeActive);
}

async function refreshDeactivateOS(){
  if(genesisRole() !== "admin") return;
  const list = document.getElementById("genesisDeviceList");
  const history = document.getElementById("genesisActionHistory");
  if(!list || !history) return;

  try{
    const devices = await genesisPublicGet(
      "genesis_devices?select=display_id,active,last_seen&order=display_id.asc"
    );
    const myId = Number(localStorage.getItem("genesisDisplayId"));

    list.innerHTML = (devices || []).map(d=>{
      const isMe = Number(d.display_id) === myId;
      return `<div class="admin-device">
        <div class="device-id">ID ${escapeHTML(d.display_id)}</div>
        <div>
          <div class="${d.active ? "status-active" : "status-off"}">${d.active ? "Active" : "Deactivated"}${isMe ? " · This device" : ""}</div>
          <div class="muted" style="font-size:9px;margin-top:2px">Last seen ${escapeHTML(new Date(d.last_seen).toLocaleString())}</div>
        </div>
        <button class="os-btn" onclick="setGenesisDevice(${Number(d.display_id)},${d.active ? "false" : "true"})">
          ${d.active ? "Deactivate" : "Reactivate"}
        </button>
      </div>`;
    }).join("") || `<div class="muted">No IDs yet.</div>`;

    const actions = await genesisPublicGet(
      "genesis_admin_actions?select=display_id,action,created_at&order=created_at.desc&limit=30"
    );
    history.innerHTML = (actions || []).map(a=>
      `<div class="admin-history-item">
        ID ${escapeHTML(a.display_id)} · ${escapeHTML(a.action)} · ${escapeHTML(new Date(a.created_at).toLocaleString())}
      </div>`
    ).join("") || `<div class="muted">No actions yet.</div>`;
  }catch(error){
    list.innerHTML = `<div class="muted">Could not load IDs: ${escapeHTML(error.message)}</div>`;
  }
}

function setupGenesisAdminUI(){
  const admin = genesisRole() === "admin";
  document.querySelectorAll("[data-admin-only='1']").forEach(el=>{
    el.style.display = admin ? "" : "none";
  });
}

function validateGenesis12HourSession(){
  try{
    const login = JSON.parse(localStorage.getItem("genesisLogin") || "null");
    if(!login || !login.expires || Date.now() >= login.expires){
      localStorage.removeItem("genesisLogin");
      location.replace("index.html");
    }
  }catch{
    location.replace("index.html");
  }
}

function flushGenesisBrowserSession(){
  if(openWindows.browser){
    captureBrowserLocation(openWindows.browser);
    persistBrowserState(true);
  }
  Promise.resolve(window.GenesisPrism?.persistSession?.()).catch(()=>{});
}

window.addEventListener("pagehide",flushGenesisBrowserSession);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden")flushGenesisBrowserSession();
});

showGenesisIdImmediately();
setupGenesisAdminUI();
startWelcomeFireworks();
Promise.resolve(ensureGenesisDevice())
  .catch(error=>console.warn("Genesis device service:",error))
  .finally(()=>window.GenesisMessages?.start?.());
pollGenesisAnnouncement();
setInterval(checkGenesisDevice,5000);
setInterval(pollGenesisAnnouncement,3000);
setInterval(validateGenesis12HourSession,60000);
