<title>Genesis</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family: "Poppins", sans-serif;
  background: #9b7ba7;
}


/* =========================================================
   BACKGROUND
========================================================= */

.scene {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  background:
    radial-gradient(
      ellipse at 52% 107%,
      rgba(255,210,126,1) 0%,
      rgba(255,185,126,.94) 19%,
      rgba(250,156,143,.68) 39%,
      rgba(225,132,155,.24) 59%,
      transparent 74%
    ),

    linear-gradient(
      to bottom,
      #7189b0 0%,
      #807fa9 16%,
      #967da7 32%,
      #b37da2 49%,
      #ce829d 63%,
      #e78d97 76%,
      #f8a180 89%,
      #ffc276 100%
    );
}


/* =========================================================
   SKY HAZE
========================================================= */

.haze {
  position: absolute;
  left: -10%;
  top: 56%;

  width: 120%;
  height: 26%;

  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(255,190,171,.11),
      rgba(255,190,139,.15),
      transparent
    );

  filter: blur(18px);

  animation: hazeMove 15s ease-in-out infinite alternate;
}

@keyframes hazeMove {

  from {
    transform: translateX(-1.5%);
    opacity: .7;
  }

  to {
    transform: translateX(1.5%);
    opacity: 1;
  }

}


/* =========================================================
   SVG
========================================================= */

.palm-svg {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;
}


/* =========================================================
   TREE MOVEMENT
========================================================= */

.tree-motion {
  transform-box: fill-box;
  transform-origin: 50% 100%;
}

.left-main .tree-motion {
  animation: leftPalmSway 8s ease-in-out infinite alternate;
}

.right-main .tree-motion {
  animation: rightPalmSway 9s ease-in-out infinite alternate;
}

.small-palm .tree-motion {
  animation: smallPalmSway 7.5s ease-in-out infinite alternate;
}


@keyframes leftPalmSway {

  from {
    transform: rotate(-0.65deg);
  }

  to {
    transform: rotate(0.8deg);
  }

}


@keyframes rightPalmSway {

  from {
    transform: rotate(0.7deg);
  }

  to {
    transform: rotate(-0.75deg);
  }

}


@keyframes smallPalmSway {

  from {
    transform: rotate(-0.45deg);
  }

  to {
    transform: rotate(0.65deg);
  }

}


/* =========================================================
   FROND WIND
========================================================= */

.frond-wind {
  transform-box: fill-box;
  transform-origin: 0% 50%;
}

.wind1 {
  animation: wind1 4.8s ease-in-out infinite alternate;
}

.wind2 {
  animation: wind2 5.7s ease-in-out infinite alternate;
}

.wind3 {
  animation: wind3 6.4s ease-in-out infinite alternate;
}

.wind4 {
  animation: wind4 5.2s ease-in-out infinite alternate;
}


@keyframes wind1 {

  from {
    transform: rotate(-1deg);
  }

  to {
    transform: rotate(1.6deg);
  }

}


@keyframes wind2 {

  from {
    transform: rotate(.7deg);
  }

  to {
    transform: rotate(-1.5deg);
  }

}


@keyframes wind3 {

  from {
    transform: rotate(-.6deg);
  }

  to {
    transform: rotate(1.2deg);
  }

}


@keyframes wind4 {

  from {
    transform: rotate(.4deg);
  }

  to {
    transform: rotate(-1.2deg);
  }

}


/* =========================================================
   LOGIN
========================================================= */

.login-layer {
  position: absolute;
  inset: 0;

  z-index: 20;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 24px;
}


/* GLASS CARD */

.login-card {

  width: min(390px, 90vw);

  padding: 36px 34px 32px;

  border-radius: 28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.18),
      rgba(255,255,255,.08)
    );

  border: 1px solid rgba(255,255,255,.24);

  box-shadow:
    0 22px 60px rgba(67,38,74,.20),
    inset 0 1px 0 rgba(255,255,255,.25);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  text-align: center;
}


/* TITLE */

.login-title {

  margin: 0 0 6px;

  color: rgba(255,255,255,.96);

  font-size: 29px;
  font-weight: 600;

  letter-spacing: -.5px;
}


.login-subtitle {

  margin: 0 0 27px;

  color: rgba(255,255,255,.67);

  font-size: 13px;
}


/* =========================================================
   INPUTS
========================================================= */

.input-box {

  width: 100%;
  margin-bottom: 14px;
}


.input-box input {

  width: 100%;
  height: 54px;

  padding: 0 19px;

  border-radius: 17px;

  border: 1px solid rgba(255,255,255,.22);

  outline: none;

  background: rgba(255,255,255,.11);

  color: white;

  font-family: "Poppins", sans-serif;
  font-size: 14px;

  transition:
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease,
    transform .25s ease;
}


.input-box input::placeholder {
  color: rgba(255,255,255,.58);
}


.input-box input:focus {

  background: rgba(255,255,255,.16);

  border-color: rgba(255,255,255,.5);

  box-shadow:
    0 0 0 4px rgba(255,255,255,.07);

  transform: translateY(-1px);
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-button {

  width: 100%;
  height: 54px;

  margin-top: 5px;

  border: none;
  border-radius: 17px;

  cursor: pointer;

  background: rgba(255,255,255,.88);

  color: #695371;

  font-family: "Poppins", sans-serif;
  font-size: 14px;
  font-weight: 600;

  box-shadow:
    0 9px 25px rgba(75,48,82,.13);

  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}


.login-button:hover {

  transform: translateY(-2px);

  background: white;

  box-shadow:
    0 13px 30px rgba(75,48,82,.18);
}


.login-button:active {
  transform: scale(.985);
}


/* =========================================================
   ERROR MESSAGE
========================================================= */

.error-message {

  height: 20px;

  margin-top: 13px;

  color: rgba(255,235,239,.95);

  font-size: 12px;
  font-weight: 500;

  opacity: 0;

  transform: translateY(-3px);

  transition:
    opacity .25s ease,
    transform .25s ease;
}


.error-message.show {

  opacity: 1;

  transform: translateY(0);
}


/* =========================================================
   SHAKE
========================================================= */

.login-card.shake {
  animation: shake .35s ease;
}


@keyframes shake {

  0% {
    transform: translateX(0);
  }

  20% {
    transform: translateX(-6px);
  }

  40% {
    transform: translateX(6px);
  }

  60% {
    transform: translateX(-4px);
  }

  80% {
    transform: translateX(4px);
  }

  100% {
    transform: translateX(0);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .login-card {

    width: min(350px, 91vw);

    padding:
      31px
      25px
      27px;
  }


  .login-title {
    font-size: 25px;
  }

}

<!-- =========================================================
     LOGIN PANEL
========================================================= -->

<div class="login-layer">

<div
class="login-card"
id="loginCard"
>

<h1 class="login-title">
Welcome
</h1>

<p class="login-subtitle">
Sign in to continue
</p>


<div class="input-box">

<input
type="text"
id="username"
placeholder="Username"
autocomplete="off"
spellcheck="false"
>

</div>


<div class="input-box">

<input
type="password"
id="password"
placeholder="Password"
autocomplete="off"
>

</div>


<button
class="login-button"
id="loginButton"
type="button"
>
Login
</button>


<div
class="error-message"
id="errorMessage"
>
Incorrect username or password.
</div>

</div>

</div>


</div>



<script>

/* =========================================================
   ACCOUNTS
========================================================= */

const accounts = {

  "High Skys": {

    password: "Goon",

    url:
      "intro.html"

  },


  "Blueberry": {

    password: "Skids",

    url:
      "intro.html"

  }

};



/* =========================================================
   ELEMENTS
========================================================= */

const usernameInput =
  document.getElementById("username");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const errorMessage =
  document.getElementById("errorMessage");

const loginCard =
  document.getElementById("loginCard");



/* =========================================================
   LOGIN FUNCTION
========================================================= */

function login() {

  const username =
    usernameInput.value.trim();

  const password =
    passwordInput.value;

  const account =
    accounts[username];


  /* SUCCESS */

  if (
    account &&
    account.password === password
  ) {

    errorMessage.classList.remove("show");


    /* GitHub Pages login state */
    sessionStorage.setItem("realmAuth", "1");
    sessionStorage.setItem("realmUser", username);

    /*
      Continue into the Genesis cinematic intro.
    */

    try {
      window.location.href = account.url;
    }
    catch (error) {
      window.location.href = "intro.html";
    }

    return;
  }


  /* =========================================================
     WRONG LOGIN
  ========================================================= */

  errorMessage.classList.add("show");

  loginCard.classList.remove("shake");

  void loginCard.offsetWidth;

  loginCard.classList.add("shake");

  passwordInput.value = "";

  passwordInput.focus();

}



/* =========================================================
   BUTTON CLICK
========================================================= */

loginButton.addEventListener(
  "click",
  login
);



/* =========================================================
   ENTER FROM USERNAME
========================================================= */

usernameInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      passwordInput.focus();

    }

  }
);



/* =========================================================
   ENTER FROM PASSWORD
========================================================= */

passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      login();

    }

  }
);

</script>
