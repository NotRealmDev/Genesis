name: Render Wisp server
on:
  pull_request:
    paths:
      - 'render.yaml'
      - 'render-wisp/**'
      - '.github/workflows/render-wisp-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: render-wisp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
